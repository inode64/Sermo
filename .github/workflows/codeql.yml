name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 4"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # python covers scripts/: cover_gate.py and docs_sync_check.py gate the
        # build, and remote-deploy/ runs as root over SSH on the fleet. It was
        # the only supported language in the tree that nothing analysed.
        language: [go, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache: true
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # The default suite is the narrow one. security-extended adds the
          # lower-precision security queries; findings land in the Security tab
          # and do not fail this workflow, so widening it costs no build time
          # budget beyond the extra analysis.
          queries: security-extended
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
