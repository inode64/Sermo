name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: build & check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install analyzers
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          go install golang.org/x/tools/cmd/goimports@v0.48.0
          go install golang.org/x/tools/cmd/deadcode@v0.48.0
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          go install github.com/google/yamlfmt/cmd/yamlfmt@v0.21.0
          npm ci
          pip install 'yamllint==1.38.0' 'ruff==0.16.2' 'semgrep==1.172.0'
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      # NilAway ships as a golangci-lint module plugin, so the lint gate needs a
      # bespoke binary. Both versions are pinned in .custom-gcl.yml, which is
      # therefore a sound cache key: a rebuild happens only when that file moves.
      - name: Cache custom golangci-lint
        uses: actions/cache@v6
        with:
          path: bin/custom-gcl
          key: custom-gcl-${{ runner.os }}-${{ hashFiles('.custom-gcl.yml') }}
      - name: Build custom golangci-lint (NilAway plugin)
        run: |
          # A cache hit restores the binary with its original build time, which is
          # older than the just-checked-out .custom-gcl.yml. Without this touch the
          # make rule would judge it stale and rebuild on every run.
          if [ -f bin/custom-gcl ]; then touch bin/custom-gcl; fi
          make custom-gcl
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - run: make build
      # On failure, surface the tail of the gate's output as annotations: job
      # logs need repository auth to read, annotations do not, so the failure
      # is diagnosable from the run page and the public API alike.
      - name: make check
        run: |
          set -o pipefail
          # Workflow commands stream to the API as they print, so if the runner
          # dies mid-gate the annotations still say which phase it died in and
          # whether the kernel OOM killer fired. Both jobs have been dying by
          # external SIGTERM with nothing readable.
          sudo dmesg -wT 2>/dev/null | grep --line-buffered -iE "out of memory|oom-kill|killed process" | while IFS= read -r line; do
            echo "::warning title=kernel::$line"
          done &
          echo "::notice title=phase::check started $(free -m | grep '^Mem:')"
          phase_stream() (
            while IFS= read -r line; do
              echo "$line"
              case $line in
                "go vet"*|"go fix"*|staticcheck*|custom-gcl*|govulncheck*|semgrep*|shellcheck*|cover-gate*|"ok "*|FAIL*|"--- FAIL"*)
                  echo "::notice title=phase::$line" ;;
              esac
            done
          )
          if ! make check 2>&1 | tee /tmp/check.log | phase_stream; then
            grep -E "FAIL|Error [0-9]|error:" /tmp/check.log | tail -n 5 | while IFS= read -r line; do
              echo "::error title=make check::$line"
            done
            echo "::error title=make check (tail)::$(tail -c 700 /tmp/check.log | tr '\n' ' ')"
            exit 1
          fi
      # Advisory: unreachable-function report. Reflection and build tags cause
      # false positives, so this never fails the build — triage by hand.
      - name: deadcode (advisory)
        continue-on-error: true
        run: make deadcode
      # Advisory baseline: report remaining cyclomatic complexity without
      # failing PRs on existing debt.
      - name: quality report (advisory)
        run: make quality-report

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: make race
        run: |
          set -o pipefail
          sudo dmesg -wT 2>/dev/null | grep --line-buffered -iE "out of memory|oom-kill|killed process" | while IFS= read -r line; do
            echo "::warning title=kernel::$line"
          done &
          echo "::notice title=phase::race started $(free -m | grep '^Mem:')"
          phase_stream() (
            while IFS= read -r line; do
              echo "$line"
              case $line in
                "go test"*|"ok "*|FAIL*|"--- FAIL"*|WARNING*)
                  echo "::notice title=phase::$line" ;;
              esac
            done
          )
          if ! make race 2>&1 | tee /tmp/race.log | phase_stream; then
            grep -E "FAIL|DATA RACE|Error [0-9]|error:" /tmp/race.log | tail -n 5 | while IFS= read -r line; do
              echo "::error title=make race::$line"
            done
            echo "::error title=make race (tail)::$(tail -c 700 /tmp/race.log | tr '\n' ' ')"
            exit 1
          fi

  # Runs on every event, not just the weekly cron. The seven targets parse
  # operator-supplied YAML and the process selectors that decide what may be
  # signalled, so a crash here is a crash on a malformed config file — worth
  # catching in the pull request that introduces it rather than up to a week
  # later. Wall-clock cost is zero: jobs run in parallel and 7x20s plus build
  # lands near four minutes, well inside the build & check job it runs beside.
  # The cron and manual runs keep the deeper 60s budget.
  fuzz:
    name: configuration and safety-parser fuzzing
    runs-on: ubuntu-latest
    # Fuzzing is unbounded by nature; cap it so a wedged target cannot hold a
    # runner for the account default of six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: make fuzz FUZZ_TIME=${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '60s' || '20s' }}
