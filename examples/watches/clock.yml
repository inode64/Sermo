name: clock-drift
category: host
# Tier 1 of the three-tier drift policy: ALERT at 1s. Read-only.
#
# Tier 2 (clock-makestep.yml) forces a correction at 5s; tier 3 (clock-ceph.yml)
# tightens the alert to 5ms on ceph nodes and never steps the clock.
monitor: disabled
interval: 5m
check:
  type: clock
  servers:
    - time.cloudflare.com
    - pool.ntp.org
  max_offset: 1s
  max_stratum: 4
  max_root_dispersion: 250ms
  timeout: 3s
for: { cycles: 2 }
then:
  notify: [ops-email]
