name: zombies
category: process
# Watch for accumulating zombie processes (a parent not reaping its children).
monitor: disabled
interval: 1m
check:
  type: zombies
  count: { op: ">", value: 20 }
  severity: warning
  levels:
    error: { count: { op: ">", value: 100 } }
for: { cycles: 3 }
then:
  hook:
    command: [/usr/local/bin/sermo-zombies-alert.sh]
