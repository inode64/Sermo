name: coredumps
category: host
# A process crashed. Its unit may restart it, and a healthy daemon replaces a
# dead worker silently, so the dump is often the only trace. The check counts the
# dumps systemd-coredump takes in, including one whose handler timed out and left
# no file, and fires on the cycle a new one arrives; `clear` keeps the alert up
# for an hour after the last one. `coredumpctl list` names the program.
monitor: disabled
interval: 30s
check:
  type: coredump
  severity: warning
clear: { duration: 1h }
then:
  hook:
    command: [/usr/local/bin/sermo-coredump-alert.sh]
