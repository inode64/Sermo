notifiers:
  ops-telegram:
    # enabled: false  # keep configured but skip delivery attempts
    type: telegram
    # template: default-alert
    token: "${env:TELEGRAM_TOKEN}"  # bot token from @BotFather; kept inside the API URL, never surfaced
    chat_id: "-1001234567890"  # numeric chat/channel id or @channelname
    # parse_mode: MarkdownV2  # HTML, Markdown or MarkdownV2; omit for plain text
    # silent: true  # deliver quietly, without sound or vibration
    # message_thread_id: 42  # post into a specific forum topic within a group
