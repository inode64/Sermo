name: redis-cache
clone: redis-main

# A distinct cache instance runs as its own unit (overrides the redis catalog service).
service: redis-cache

# Cloning copies redis-main BEFORE variable expansion, so overriding the `port`
# variable alone is enough — every check that references ${port} resolves to the
# new value after expansion.
variables:
  port: 6380

# The redis catalog service lists its pidfiles directly, not through a variable,
# so the second instance overrides the key itself.
pidfile: /run/redis-cache/redis.pid
