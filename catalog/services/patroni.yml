name: patroni
display_name: "Patroni"
category: database
description: Patroni high-availability controller for PostgreSQL clusters.
service:
  systemd:
    - patroni
  openrc:
    - patroni
apps:
  - patroni
restart_on_change:
  apps:
    - patroni
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: postgres
  host: 127.0.0.1
  port: 8008
  config: /etc/patroni/patroni.yml
  # Patroni is a Python program. The daemon's executable is the interpreter its
  # launcher's `#!` line names, and the launcher is that interpreter's first
  # argument. Gentoo installs the launcher once per interpreter under
  # python-exec and makes /usr/bin/patroni a wrapper, so the per-interpreter
  # files come first; elsewhere the packaged script is the launcher. A launcher
  # that starts through `env` names no interpreter: set `interpreter` there.
  launcher:
    - /usr/lib/python-exec/python3.16/patroni
    - /usr/lib/python-exec/python3.15/patroni
    - /usr/lib/python-exec/python3.14/patroni
    - /usr/lib/python-exec/python3.13/patroni
    - /usr/lib/python-exec/python3.12/patroni
    - /usr/lib/python-exec/python3.11/patroni
    - ${patroni_binary}
  interpreter:
    from_file: ${launcher}
    pattern: '^#!\s*(\S+)'
    default: /usr/bin/python3
config_files:
  - ${config}
  - /etc/patroni
preflight:
  config:
    type: command
    command:
      - ${patroni_binary}
      - --validate-config
      - --ignore-listen-port
      - ${config}
    timeout: 30s
processes:
  main:
    exe: ${interpreter}
    cmd: '(^|[[:space:]])${launcher}([[:space:]]|$)'
    user: ${user}
pidfile: /run/patroni.pid
reload:
  signal: HUP
reload_on_change:
  paths:
    - ${config}
    - /etc/patroni
stop_policy:
  graceful_timeout: 60s
  term_timeout: 30s
  kill_only_if:
    users:
      - ${user}
    exe_any:
      - ${interpreter}
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
watches:
  service:
    check:
      type: service
      expect: active
  api-port:
    check:
      type: tcp
      host: ${host}
      port: ${port}
      timeout: 2s
      verify: true
  api:
    check:
      type: http
      url: http://${host}:${port}/patroni
      expect_status: 200
      timeout: 3s
      optional: true
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 10m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
