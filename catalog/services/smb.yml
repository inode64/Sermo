name: smb
aliases:
  - samba
display_name: Samba SMB service
category: storage
description: Samba SMB service; monitor NetBIOS separately when nmbd is enabled.
service:
  systemd:
    - smb
  openrc:
    - samba
    - smb
apps:
  - smbd
restart_on_change:
  apps:
    - smbd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  port: 445
  netbios_port: 139
  user: root
  winbindd_binary: ${bindir}/winbindd
  nmbd_binary: ${bindir}/nmbd
pidfiles:
  smbd: /run/samba/smbd.pid
preflight:
  config:
    type: command
    command:
      - ${smbd_testparm}
      - -s
    timeout: 30s
    analyze:
      use:
        - common
      rules:
        - id: dir-artifact
          match: (?i)(lock|pid) directory .* does not exist
          severity: ok
processes:
  smbd:
    exe: ${smbd_binary}
    user: ${user}
  winbindd:
    exe: ${winbindd_binary}
    user: ${user}
    enable_if:
      init: openrc
      file: /etc/conf.d/samba
      key: daemon_list
      contains: winbind
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
watches:
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: tcp
      port: ${port}
  smb:
    check:
      type: smb
      port: ${port}
      timeout: 3s
  netbios:
    check:
      type: tcp
      port: ${netbios_port}
      optional: true
  # OpenRC's daemon_list runs nmbd from this service with no unit of its own. It
  # stays a watch, not a selector: smb must not own a daemon that may outlive it.
  # The file also exists on a Gentoo systemd host, where nmb.service decides.
  nmbd:
    enable_if:
      init: openrc
      file: /etc/conf.d/samba
      key: daemon_list
      contains: nmbd
    check:
      type: process
      exe: ${nmbd_binary}
      user: ${user}
      state: running
      optional: true
      requires:
        - service
  winbindd:
    enable_if:
      init: openrc
      file: /etc/conf.d/samba
      key: daemon_list
      contains: winbind
    check:
      type: process
      exe: ${winbindd_binary}
      user: ${user}
      state: running
      requires:
        - service
  restart-if-worker-thread-hot:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 6m
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
