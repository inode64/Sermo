name: containerd
display_name: containerd
category: virtualization
description: Container runtime used by Docker, Kubernetes and other OCI tooling.
service:
  systemd:
    - containerd
  openrc:
    - containerd
restart_policy:
  mode: native
apps:
  - containerd
variables:
  user: root
  config: /etc/containerd/config.toml
  socket: /run/containerd/containerd.sock
preflight:
  config:
    type: command
    command:
      - ${containerd_binary}
      - -c
      - ${config}
      - config
      - dump
    timeout: 15s
config_files:
  - ${config}
socket: ${socket}
processes:
  main:
    exe: ${containerd_binary}
    user: ${user}
  # A shim owns a running container and outlives a containerd restart on purpose.
  # Delegated keeps it monitored while barring it from every kill decision, so
  # neither a stop nor an init-state reconciliation can take containers down.
  shim:
    exe: ${containerd_shim_binary}
    user: ${user}
    delegated: true
restart_on_change:
  paths:
    - ${config}
  apps:
    containerd:
      level: patch
  messages:
    path: >-
      ${display_name} will restart after config change: ${change.path}
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
watches:
  service:
    check:
      type: service
      expect: active
  restart-if-version-failed:
    check:
      type: command
      command:
        - ${containerd_binary}
        - --version
      timeout: 5s
      verify: true
    for:
      cycles: 3
    then:
      action: restart
  restart-if-worker-thread-hot:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 6m
    then:
      action: restart
  # No fds watch: this service's control group legitimately holds workload the
  # daemon does not own — libvirt's per-domain virtiofsd/swtpm helpers, Docker's
  # containers and shims, glusterd's bricks — and a service-scoped metric sums
  # every process discovery attributes to the service, control-group members
  # included. RLIMIT_NOFILE is charged per process, so one summed count against
  # one constant asserts something about the workload rather than about the
  # daemon: on a live host libvirtd held 42 descriptors of its own against a
  # >50k sum. The per-service fd series stays on the detail graphs; alert on a
  # host watch for host-wide exhaustion.
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
