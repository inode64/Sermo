name: acpid
display_name: ACPI Daemon
category: hardware
service: acpid
also_service:
  systemd:
    - unit: acpid.socket
      optional: true
apps:
  - acpid
restart_on_change:
  apps:
    - acpid
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
pidfile: /run/acpid.pid
processes:
  main:
    exe: ${acpid_binary}
    user: root
reload:
  signal: HUP
watches:
  service:
    check:
      type: service
      expect: active
  acpid:
    # A systemd activation socket can stay active after the daemon's socket fails.
    check:
      type: acpid
      timeout: 3s
      verify: true
    for:
      cycles: 2
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
