name: rrdcached
display_name: RRD Cached
category: observability
description: RRDTool data caching daemon.
service: rrdcached
pidfile: /run/rrdcached.pid
socket: /run/rrdcached.sock
watches:
  service:
    check:
      type: service
      expect: active
  restart-if-socket-missing:
    check:
      type: socket
      path: /run/rrdcached.sock
      requires:
        - service
      verify: true
    for:
      cycles: 3
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
