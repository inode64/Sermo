name: memcached
display_name: Memcached
category: database
description: Memcached in-memory cache
type: cache
service: memcached
apps:
  - memcached
restart_on_change:
  apps:
    - memcached
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  host: 127.0.0.1
  port: 11211
  user: memcached
processes:
  main:
    exe: ${memcached_binary}
    user: ${user}
watches:
  service:
    check:
      type: service
      expect: active
  memory:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 60%
      optional: true
  # A busy cache is not a broken one: restarting it empties the cache and
  # sends every miss to the backend at once.
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
  # One error when memcached refuses clients: past its connection limit (-c)
  # it accepts, answers "Too many open connections" and closes, and counts it
  # in rejected_connections. Sermo reports the refusal as busy and never
  # restarts for it; raise -c or find the client that leaks connections.
  alert-if-connections-rejected:
    check:
      type: memcached
      host: ${host}
      port: ${port}
      timeout: 3s
      optional: true
      severity: error
      max_increase:
        rejected_connections: 0
      within: 10m
    then:
      action: alert
      message: >-
        ${display_name} refused client connections: its connection limit (-c) is exhausted
  restart-if-memcached-failed:
    check:
      type: memcached
      host: ${host}
      port: ${port}
      timeout: 3s
    for:
      cycles: 3
    then:
      action: restart
  restart-if-tcp-failed:
    check:
      type: tcp
      host: ${host}
      port: ${port}
      timeout: 2s
    for:
      cycles: 3
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
