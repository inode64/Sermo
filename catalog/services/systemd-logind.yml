name: systemd-logind
display_name: systemd-logind
category: system
description: System login and seat manager.
service:
  systemd:
    - systemd-logind
apps:
  - systemd-logind
variables:
  busctl_binary: /usr/bin/busctl
  user: root
processes:
  main:
    exe: ${systemd_logind_binary}
    user: ${user}
rules:
  # SSH and background sessions have no seat. Stop/start may release logind's
  # device descriptors, so sessions attached to a local seat stay protected.
  block-stop-during-local-sessions:
    type: guard
    blocks: [stop, restart]
    if:
      not:
        command:
          command:
            - ${busctl_binary}
            - --system
            - --auto-start=no
            - --allow-interactive-authorization=no
            - --json=short
            - call
            - org.freedesktop.login1
            - /org/freedesktop/login1
            - org.freedesktop.login1.Manager
            - ListSessions
          expect_exit: 0
          # Each record must have an empty seat; JSON validation also rejects
          # truncated arrays, missing separators and trailing commas.
          expect_stdout:
            op: '=~'
            value: '^\{"type":"a\(susso\)","data":\[\[(\["[A-Za-z0-9_-]+",[0-9]+,"([^"\\]|\\.)+","","/org/freedesktop/login1/session/[A-Za-z0-9_]+"\],?)*\]\]\}$'
          expect_json: { type: 'a(susso)' }
          timeout: 5s
    then:
      action: block
      message: Local seat sessions are registered or cannot be inspected; stop and restart denied
watches:
  service:
    check:
      type: service
      expect: active
  bus:
    check:
      type: dbus
      timeout: 3s
  login1:
    check:
      type: dbus
      bus_name: org.freedesktop.login1
      object_path: /org/freedesktop/login1
      require_owner: true
      requires:
        - bus
      timeout: 3s
      verify: true
