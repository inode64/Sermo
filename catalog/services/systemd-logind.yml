name: systemd-logind
display_name: systemd-logind
category: system
description: System login and seat manager.
service:
  systemd:
    - systemd-logind
variables:
  busctl_binary: /usr/bin/busctl
rules:
  block-stop-during-login-sessions:
    type: guard
    blocks: [stop, restart]
    if:
      not:
        command:
          command:
            - ${busctl_binary}
            - --system
            - --auto-start=no
            - --allow-interactive-authorization=no
            - call
            - org.freedesktop.login1
            - /org/freedesktop/login1
            - org.freedesktop.login1.Manager
            - ListSessions
          expect_exit: 0
          expect_stdout: { op: '==', value: 'a(susso) 0' }
          timeout: 5s
    then:
      action: block
      message: Login sessions are active or cannot be inspected; stop and restart denied
watches:
  service:
    check:
      type: service
      expect: active
  bus:
    check:
      type: dbus
      timeout: 3s
  login1:
    check:
      type: dbus
      bus_name: org.freedesktop.login1
      object_path: /org/freedesktop/login1
      require_owner: true
      requires:
        - bus
      timeout: 3s
      verify: true
