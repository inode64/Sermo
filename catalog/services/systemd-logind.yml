name: systemd-logind
display_name: systemd-logind
category: system
description: System login and seat manager.
service:
  systemd:
    - systemd-logind
watches:
  service:
    check:
      type: service
      expect: active
  bus:
    check:
      type: dbus
      timeout: 3s
  login1:
    check:
      type: dbus
      bus_name: org.freedesktop.login1
      object_path: /org/freedesktop/login1
      require_owner: true
      requires:
        - bus
      timeout: 3s
      verify: true
