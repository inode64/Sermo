name: pmlogger_farm
display_name: PCP Archive Logger Farm
category: observability
description: Performance Co-Pilot pmlogger farm service.
service:
  systemd:
    - pmlogger_farm
apps:
  - pmlogger_farm
variables:
  user: pcp
# Deliberately alert-only, with no restart-if-inactive rule: the farm unit is
# `disabled` and is driven by pmlogger.service through PartOf=/RequiredBy=, so
# "not active" is as often the operator stopping that stack as a fault. Sermo
# cannot tell the two apart — a rule's references are scoped to its own service,
# so the condition cannot ask whether the primary is up — and restarting the farm
# alone would resurrect it without its primary. A failed farm is reported by the
# service check and by watch-failed-units; repairing it is a manual
# `sermoctl restart`, which is what the safe operation path is for.
watches:
  service:
    check:
      type: service
      expect: active
      verify: true
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
