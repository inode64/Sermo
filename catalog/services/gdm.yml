name: gdm
display_name: GNOME Display Manager
category: system
description: GNOME graphical login and display manager.
service:
  systemd:
    - gdm
    - gdm3
apps:
  - gdm
processes:
  main:
    exe: ${gdm_binary}
    user: root
watches:
  service:
    check:
      type: service
      expect: active
  version:
    check:
      type: dbus
      bus_name: org.gnome.DisplayManager
      object_path: /org/gnome/DisplayManager/Manager
      require_owner: true
      probe: property
      dbus_interface: org.gnome.DisplayManager.Manager
      property: Version
      timeout: 5s
      verify: true
