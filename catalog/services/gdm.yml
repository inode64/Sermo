name: gdm
display_name: GNOME Display Manager
category: system
description: GNOME graphical login and display manager.
service:
  systemd:
    - gdm
    - gdm3
apps:
  - gdm
processes:
  main:
    exe: ${gdm_binary}
    user: root
rules:
  # Stopping GDM ends every graphical session it hosts, with whatever the user
  # had open. An updated binary or library therefore waits for the logout:
  # the restart is retried and goes through once nobody is logged in on a
  # seat. The greeter is GDM's own session (class greeter) and does not count.
  block-stop-during-user-sessions:
    type: guard
    blocks: [stop, restart]
    if:
      active:
        check: user-sessions
    then:
      action: block
      message: >-
        A user is logged in on a local seat, or the sessions cannot be inspected; ${display_name} is not stopped or restarted until they log out
watches:
  service:
    check:
      type: service
      expect: active
  user-sessions:
    check:
      type: seated_sessions
      class: user
      reports: state
      optional: true
  version:
    check:
      type: dbus
      bus_name: org.gnome.DisplayManager
      object_path: /org/gnome/DisplayManager/Manager
      require_owner: true
      probe: property
      dbus_interface: org.gnome.DisplayManager.Manager
      property: Version
      timeout: 5s
      verify: true
