name: tuned
display_name: TuneD
category: system
description: Dynamic system tuning daemon.
service:
  systemd:
    - tuned
  openrc:
    - tuned
apps:
  - tuned
restart_on_change:
  apps:
    - tuned
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
pidfile:
  - /run/tuned/tuned.pid
  - /run/tuned.pid
# TuneD is a Python script, so /proc/<pid>/exe resolves to the interpreter
# (`/usr/bin/python3.13 -Es /usr/sbin/tuned -l -P`) and an `exe` selector can
# never match. Narrow on the script path in the cmdline instead, as the unifi
# profile does for its JVM. Without any process selector the profile relied on
# the pidfile alone, and a stopped service has no pidfile — which made discovery
# fail and blocked Sermo from ever starting it.
processes:
  main:
    cmd: (^|/)python[0-9.]* .*${tuned_binary}( |$)
    user: root
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
watches:
  service:
    check:
      type: service
      expect: active
  dbus:
    check:
      type: dbus
      bus_name: com.redhat.tuned
      object_path: /Tuned
      probe: introspect
      dbus_interface: com.redhat.tuned.control
      timeout: 5s
      verify: true
  restart-if-active-failed:
    check:
      type: command
      command:
        - tuned-adm
        - active
      timeout: 10s
      verify: true
    for:
      cycles: 3
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
