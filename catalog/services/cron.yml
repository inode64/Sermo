name: cron
display_name: Cron
category: scheduler
description: Periodic command scheduler daemon.
service:
  systemd:
    - cron
    - crond
  openrc:
    - crond
    - cron
apps:
  - cron
variables:
  user: root
processes:
  main:
    exe: ${cron_binary}
    user: ${user}
# Only the daemon must exit on stop: jobs already running finish; a job runner
# re-executes the daemon binary but descends from it, so it is kept. Every other
# process is kept and never signalled.
stop_policy:
  keep_children: true
watches:
  service:
    check:
      type: service
      expect: active
      verify: true
  process:
    check:
      type: process
      exe: ${cron_binary}
      user: ${user}
      state: running
      requires:
        - service
