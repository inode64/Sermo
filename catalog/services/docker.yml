name: docker
display_name: Docker Engine
category: virtualization
description: Docker Engine container runtime.
service:
  systemd:
    - docker
  openrc:
    - docker
also_service:
  systemd:
    - docker.socket
restart_policy:
  mode: native
apps:
  - docker
restart_on_change:
  apps:
    - docker
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  socket: /run/docker.sock
  config: /etc/docker/daemon.json
config_files:
  - ${config}
preflight:
  config:
    type: command
    # Docker's config file is optional: validate it when present, but let a host
    # without /etc/docker/daemon.json start normally.
    command:
      - sh
      - -c
      - test ! -e "$1" || exec "$0" --validate --config-file="$1"
      - ${docker_daemon}
      - ${config}
    timeout: 30s
processes:
  main:
    exe: ${docker_daemon}
    user: root
  # One docker-proxy per published container port; it belongs to the container,
  # not to the daemon, and survives a dockerd restart on purpose. Delegated keeps
  # it monitored while barring it from every kill decision.
  proxy:
    exe: ${docker_proxy_binary}
    user: root
    delegated: true
pidfile: /run/docker.pid
reload:
  signal: HUP
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
reload_on_change:
  paths:
    - ${config}
watches:
  service:
    check:
      type: service
      expect: active
  engine:
    check:
      type: docker
      socket: ${socket}
      timeout: 3s
      verify: true
  # No fds watch: this service's control group legitimately holds workload the
  # daemon does not own — libvirt's per-domain virtiofsd/swtpm helpers, Docker's
  # containers and shims, glusterd's bricks — and a service-scoped metric sums
  # every process discovery attributes to the service, control-group members
  # included. RLIMIT_NOFILE is charged per process, so one summed count against
  # one constant asserts something about the workload rather than about the
  # daemon: on a live host libvirtd held 42 descriptors of its own against a
  # >50k sum. The per-service fd series stays on the detail graphs; alert on a
  # host watch for host-wide exhaustion.
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
