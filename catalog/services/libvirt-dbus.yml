name: libvirt-dbus
display_name: libvirt D-Bus
category: virtualization
description: D-Bus bridge exposing libvirt objects to desktop and management clients.
service:
  systemd:
    - libvirt-dbus
  openrc:
    - libvirt-dbus
apps:
  - libvirt-dbus
variables:
  user: libvirtdbus
  legacy_user: root
processes:
  main:
    exe: ${libvirt_dbus_binary}
    user: ${user}
  legacy-root:
    exe: ${libvirt_dbus_binary}
    user: ${legacy_user}
watches:
  service:
    check:
      type: service
      expect: active
  bus:
    check:
      type: dbus
      timeout: 3s
  restart-if-dbus-failed:
    check:
      type: dbus
      bus_name: org.libvirt
      object_path: /org/libvirt
      require_owner: true
      requires:
        - bus
      timeout: 5s
      verify: true
    for:
      cycles: 3
    then:
      action: restart
