name: named
display_name: BIND (named)
category: network
service: named
apps:
  - named
restart_on_change:
  apps:
    - named
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  host: 127.0.0.1
  port: 53
  user: named
  query: localhost
  # Name the opt-in `recursion` and `resolver` watches resolve: a public name
  # every recursive server must answer.
  recursion_query: example.com
os:
  ubuntu:
    variables:
      user: bind
preflight:
  config:
    type: command
    command:
      - ${named_checkconf}
      - -z
    timeout: 30s
    analyze:
      use:
        - common
pidfile: /run/named/named.pid
config_files:
  - /etc/bind/named.conf
  - /etc/named.conf
processes:
  main:
    exe: ${named_binary}
    user: ${user}
reload:
  signal: HUP
watches:
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: dns
      host: ${host}
      port: ${port}
      query: ${query}
  # Enable on a recursive resolver: the server must actually resolve a public
  # name, not merely answer. REFUSED (an `allow-recursion`/`allow-query` ACL
  # that leaves out the probed address) and SERVFAIL (upstream unreachable,
  # DNSSEC validation failure) fail the watch with the rcode in its data; the
  # `port` check alone keeps passing because the daemon is up. Add one watch
  # per listener address a client population uses (LAN, VPN) so an ACL that
  # covers only some networks is caught.
  recursion:
    enabled: false
    check:
      type: dns
      host: ${host}
      port: ${port}
      query: ${recursion_query}
      timeout: 3s
      expect:
        rcode: NOERROR
        answers: { op: '>', value: 0 }
    for: { cycles: 2 }
  # Enable where the host's own resolv.conf points at this server (or has no
  # fallback): when named stops answering, the host itself loses name
  # resolution, including the one Sermo needs to deliver notifications.
  resolver:
    enabled: false
    check:
      type: dns
      resolvconf: true
      query: ${recursion_query}
      timeout: 3s
      expect:
        rcode: NOERROR
        answers: { op: '>', value: 0 }
    for: { cycles: 2 }
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
  alert-if-io-high:
    check:
      type: metric
      scope: service
      name: io
      op: '>'
      # 100 MB/s. The shipped thresholds used to be one host's live samples
      # (451 B/s for ssh, 32 MB/s for ceph-osd), so nearly every service alerted
      # on normal work. `io` is a rate in B/s and has no percentage form, so one
      # deliberately generous ceiling is the closest a packaged default gets to
      # true everywhere; a storage-plane host raises it in services.local/.
      value: 104857600
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} IO usage stayed above ${check.threshold} (current ${check.value})
