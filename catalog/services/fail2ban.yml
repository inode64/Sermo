name: fail2ban
display_name: Fail2ban
category: security
service:
  systemd:
    - fail2ban
    - fail2ban-server
  openrc:
    - fail2ban
    - fail2ban-server
apps:
  - python3
  - fail2ban
restart_on_change:
  apps:
    - python3
    - fail2ban
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
preflight:
  config:
    type: command
    command:
      - ${fail2ban_binary}
      - -t
    timeout: 30s
pidfile: /run/fail2ban/fail2ban.pid
# Gentoo's OpenRC script runs the server under supervise-daemon, which shares
# the service cgroup and otherwise reads as a stray. Init-scoped because a
# selector that can never match would block operations on a systemd unit.
processes:
  supervisor:
    exe: /usr/bin/supervise-daemon
    cmd: ^supervise-daemon fail2ban --start([[:space:]]|$)
    user: root
    enable_if:
      init: openrc
reload:
  command:
    - ${fail2ban_client}
    - reload
watches:
  service:
    check:
      type: service
      expect: active
  fail2ban:
    check:
      type: fail2ban
      timeout: 3s
