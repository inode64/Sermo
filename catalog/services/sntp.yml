name: sntp
display_name: SNTP
category: network
description: One-shot SNTP system clock synchronization.
# `sntp -s` can step the system clock.  Expose it for operator-initiated
# recovery of a failed boot-time unit, but never attach an automatic restart
# rule to the service check.
service:
  systemd:
    - sntp
stop_policy:
  graceful_timeout: 1s
watches:
  service:
    check:
      type: service
      expect: active
      verify: true
