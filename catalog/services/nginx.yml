name: nginx
display_name: Nginx
category: web
service: nginx
apps:
  - nginx
restart_on_change:
  libraries:
    - glibc
    - openssl
    - zlib
    - pcre2
    - libxcrypt
    - maxminddb
  apps:
    - nginx
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
    library: >-
      ${display_name} will restart after library change: ${change.library} (${change.path})
variables:
  host: 127.0.0.1
  port: 80
  tls_port: 443
preflight:
  config:
    type: command
    command:
      - ${nginx_binary}
      - -t
    timeout: 30s
    analyze:
      use:
        - common
        - web
pidfile: /run/nginx/nginx.pid
config_files:
  - /etc/nginx/nginx.conf
processes:
  main:
    exe: ${nginx_binary}
    user: root
reload:
  command:
    - ${nginx_binary}
    - -s
    - reload
reload_on_change:
  paths:
    - /etc/nginx/nginx.conf
watches:
  # Libraries the processes still map from before an update, including those
  # restart_on_change does not list (ICU, ImageMagick and other sonames that
  # change with each version). Advisory: restart_on_change drives restarts.
  alert-if-libraries-replaced:
    check:
      type: stale_libraries
      interval: 5m
      severity: warning
    then:
      action: alert
      message: >-
        ${display_name} still uses libraries replaced on disk; restart it to load the updated versions
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: tcp
      host: ${host}
      port: ${port}
  http:
    check:
      type: http
      url: http://${host}:${port}/
      expect_status:
        op: <
        value: 500
      timeout: 5s
      verify: true
  cert:
    check:
      type: cert
      host: ${host}
      port: ${tls_port}
      cert_verify: false
      expires_in_days: 21
      timeout: 5s
  restart-if-worker-thread-hot:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 6m
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
