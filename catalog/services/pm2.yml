name: pm2
display_name: PM2
category: system
description: Node.js process manager supervising application processes.
service:
  systemd:
    - pm2-root
    - pm2
  openrc:
    - pm2
apps:
  - pm2
  - node
restart_on_change:
  apps:
    - pm2
    - node
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: root
pidfile:
  - /run/pm2.pid
  - /root/.pm2/pm2.pid
# PM2 is a Node.js program: its God Daemon runs the node binary, never the pm2
# launcher script, and renames itself "PM2 v<version>: God Daemon (<home>)".
# The applications it manages are node processes of the same user, so the
# command line is what tells the daemon from its children and from other node
# services on the host.
processes:
  main:
    exe: ${node_binary}
    cmd: '^PM2 v[0-9][^ ]*: God Daemon'
    user: ${user}
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
# No check here runs the pm2 CLI. Every invocation, `pm2 ping` included,
# starts PM2's God Daemon when none is running: a ping could only ever answer
# for a daemon it had just created, and that daemon outlives the probe in the
# caller's control group (see the pm2 app). Liveness is read instead: the init
# unit's state and the pidfile check the `pidfile:` candidates generate.
watches:
  service:
    check:
      type: service
      expect: active
      verify: true
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 10m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
