name: glusterd
display_name: GlusterFS
category: storage
description: GlusterFS
service: glusterd
restart_policy:
  mode: native
apps:
  - glusterd
# The packaged unit is Type=forking with KillMode=process: systemd deliberately
# leaves the bricks and the self-heal daemon serving across a glusterd restart.
# Every one of them is the same executable running as root — sbin/glusterd is a
# symlink to glusterfsd — so exe and user alone cannot tell the management daemon
# from its workload. Each role therefore carries the cmdline that identifies it,
# and the workload roles are delegated: discovered and monitored, never counted
# as a residual and never signalled. Only `main` is ever stopped, which is
# exactly what KillMode=process expresses.
processes:
  main:
    exe: ${glusterd_binary}
    cmd: '^(\S*/)?glusterd(\s|$)'
    user: root
  brick:
    exe: ${glusterd_binary}
    cmd: '--process-name brick(\s|$)'
    user: root
    delegated: true
  selfheal:
    exe: ${glusterd_binary}
    cmd: '--process-name glustershd(\s|$)'
    user: root
    delegated: true
  # The optional daemons glusterd manages, plus the FUSE client that mounts a
  # volume on this same node — `--process-name fuse`, seen on hosts that back
  # libvirt images with Gluster. A client mount is workload as much as a brick
  # is: signalling it would tear the mountpoint out from under whatever is using
  # it, so it is delegated too.
  daemon:
    exe: ${glusterd_binary}
    cmd: '--process-name (?:quotad|bitd|scrub|gfproxyd|nfs|fuse)(\s|$)'
    user: root
    delegated: true
# Storage service: keep automatic remediation rare.
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
restart_on_change:
  apps:
    - glusterd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  port: 24007
socket: /run/glusterd.socket
watches:
  service:
    check:
      type: service
      expect: active
      # Some Type=forking glusterd units can lose their PIDFile while the
      # daemon and the cluster remain healthy. Keep that backend discrepancy
      # visible without treating the data service as unavailable; the next
      # restart reconciles the stale init state on its own.
      optional: true
  port:
    check:
      type: tcp
      port: ${port}
  glusterfs:
    check:
      type: glusterfs
      port: ${port}
      timeout: 3s
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
  alert-if-io-high:
    check:
      type: metric
      scope: service
      name: io
      op: '>'
      # 100 MB/s. The shipped thresholds used to be one host's live samples
      # (451 B/s for ssh, 32 MB/s for ceph-osd), so nearly every service alerted
      # on normal work. `io` is a rate in B/s and has no percentage form, so one
      # deliberately generous ceiling is the closest a packaged default gets to
      # true everywhere; a storage-plane host raises it in services.local/.
      value: 104857600
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} IO usage stayed above ${check.threshold} (current ${check.value})
