name: libvirtd
display_name: libvirt
category: virtualization
service: libvirtd
apps:
  - libvirtd
restart_on_change:
  apps:
    - libvirtd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
processes:
  main:
    exe: ${libvirtd_binary}
    user: root
# Only the daemon must exit on stop: running guests (qemu, virtiofsd) and
# network dnsmasq keep running; on OpenRC they share the daemon's control group.
# Every other process is kept and never signalled.
stop_policy:
  keep_children: true
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
# The unit's control group can hold the hypervisor helpers of every guest, so
# the process closest to its own limit describes a guest rather than the daemon.
fds_limit: false
watches:
  service:
    check:
      type: service
      expect: active
  restart-if-libvirt-failed:
    check:
      type: libvirt
      timeout: 5s
      verify: true
    for:
      cycles: 3
    then:
      action: restart
  # No fds watch: this service's control group legitimately holds workload the
  # daemon does not own — libvirt's per-domain virtiofsd/swtpm helpers, Docker's
  # containers and shims, glusterd's bricks. Service metrics leave that kept
  # workload out, so the daemon's own count says nothing about it, and
  # RLIMIT_NOFILE is charged per process anyway: on a live host libvirtd held 42
  # descriptors of its own against >50k across its tree. The per-service fd
  # series stays on the detail graphs; alert on a host watch for host-wide
  # exhaustion.
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
