name: ceph-mgr
display_name: Ceph Manager
category: storage
description: 'Ceph manager daemon: hosts the cluster''s management modules (dashboard, prometheus, balancer, …).'
service: ceph-mgr@${hostname}
apps:
  - ceph-mgr
variables:
  user: ceph
socket: /run/ceph/ceph-mgr.${hostname}.asok
processes:
  ceph-mgr:
    exe: ${ceph_mgr_binary}
    user: ${user}
restart_on_change:
  apps:
    - ceph-mgr
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
watches:
  service:
    check:
      type: service
      expect: active
  restart-if-status-failed:
    # The daemon's own admin socket, asked natively: what `ceph --admin-daemon`
    # does, without starting the Python client for every daemon and cycle.
    check:
      type: ceph
      socket: /run/ceph/ceph-mgr.${hostname}.asok
      timeout: 5s
      verify: true
    for:
      cycles: 3
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
