name: pve-container-%n
display_name: Proxmox LXC container ${n}
category: container
description: Proxmox VE managed LXC container instance.
service:
  systemd:
    - pve-container@${n}
apps:
  - lxc
  - proxmox-ve
variables:
  user: root
# The tree under lxc-start is the container's own workload: a process in it
# near its open-files limit (a PostgreSQL backend caching files up to
# max_files_per_process, 989 of a 1024 limit) says nothing about the container
# service, which is what the fds sensor reports on.
fds_limit: false
processes:
  main:
    exe: ${lxc_binary}
    cmd: (^|[[:space:]])-n[[:space:]]+${n}([[:space:]]|$)
    user: ${user}
watches:
  service:
    check:
      type: service
      expect: active
      verify: true
  process:
    check:
      type: process
      exe: ${lxc_binary}
      cmd: (^|[[:space:]])-n[[:space:]]+${n}([[:space:]]|$)
      user: ${user}
      state: running
      requires:
        - service
