name: snmpd
display_name: Net-SNMP Daemon
category: observability
service: snmpd
apps:
  - snmpd
restart_on_change:
  apps:
    - snmpd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: root
  port: 161
pidfile: /run/snmpd.pid
processes:
  main:
    exe: ${snmpd_binary}
    user: ${user}
stop_policy:
  force_kill: auto
reload:
  signal: HUP
watches:
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: snmp
      port: ${port}
      # The daemon can intentionally restrict SNMP queries to authenticated
      # managers. Keep the probe visible, but do not misreport a healthy init
      # service as failed when no monitoring credentials were configured.
      optional: true
  restart-if-worker-thread-hot:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 6m
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
  alert-if-io-high:
    check:
      type: metric
      scope: service
      name: io
      op: '>'
      # 100 MB/s. The shipped thresholds used to be one host's live samples
      # (451 B/s for ssh, 32 MB/s for ceph-osd), so nearly every service alerted
      # on normal work. `io` is a rate in B/s and has no percentage form, so one
      # deliberately generous ceiling is the closest a packaged default gets to
      # true everywhere; a storage-plane host raises it in services.local/.
      value: 104857600
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} IO usage stayed above ${check.threshold} (current ${check.value})
