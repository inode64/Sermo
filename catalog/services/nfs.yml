name: nfs
display_name: NFS Server
category: storage
description: Kernel NFS server.
service:
  systemd:
    - nfs-server
    - nfs
  openrc:
    - nfs
# nfs-server is a coordinating oneshot whose required userspace daemons are
# managed by the init dependency graph. An isolated systemd restart stops its
# BindsTo mount daemon but cannot pull it up again.
allow_dependencies: true
apps:
  - rpc-mountd
restart_on_change:
  apps:
    - rpc-mountd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  host: 127.0.0.1
  port: 2049
# The primary NFS server lives in the kernel. rpc-mountd is owned by its own
# catalog profile; treating it as the NFS primary would block recovery precisely
# when the dependent service is absent.
processes: { }
watches:
  service:
    check:
      type: service
      expect: active
  # Not a selector, for the reason above, yet OpenRC runs it inside this service
  # with no unit of its own: without this a dead mountd would go unnoticed while
  # the kernel keeps answering the nfs probe below, and after an nfs-utils
  # upgrade nothing would renew the mountd still running the replaced binary.
  # Restarting the service starts both again. Under systemd mountd is a unit of
  # its own, which the rpc-mountd profile watches and renews.
  restart-if-mountd-stopped-or-replaced:
    enable_if: { init: openrc }
    check:
      type: process
      exe: ${rpc_mountd_binary}
      user: root
      state: running
      optional: true
      requires:
        - service
    for: { cycles: 2 }
    then:
      action: restart
  nfs:
    check:
      type: nfs
      host: ${host}
      port: ${port}
      timeout: 3s
