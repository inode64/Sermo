name: pmie_farm
display_name: PCP Inference Engine Farm
category: observability
description: Performance Co-Pilot pmie farm service.
service:
  systemd:
    - pmie_farm
apps:
  - pmie_farm
variables:
  user: pcp
# A replaced binary is alerted, never restarted here: pmie.service is
# BindsTo= this unit, and systemd stops it when the farm stops whatever the
# job mode, so restarting the farm alone leaves pmie down. pmie
# restarts over its own replaced binary through the init graph
# (allow_dependencies), which renews the farm with it.
restart_on_stale_binary: false
# Deliberately alert-only, with no restart-if-inactive rule: the farm unit is
# `disabled` and is driven by pmie.service through PartOf=/RequiredBy=, so
# "not active" is as often the operator stopping that stack as a fault. Sermo
# cannot tell the two apart — a rule's references are scoped to its own service,
# so the condition cannot ask whether the primary is up — and restarting the farm
# alone would resurrect it without its primary. A failed farm is reported by the
# service check and by watch-failed-units; repairing it is a manual
# `sermoctl restart pmie`, which restarts the farm with it.
watches:
  service:
    check:
      type: service
      expect: active
      verify: true
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
