name: pmie_farm
display_name: PCP Inference Engine Farm
category: observability
description: Performance Co-Pilot pmie farm service.
service:
  systemd:
    - pmie_farm
apps:
  - pmie_farm
variables:
  user: pcp
watches:
  service:
    check:
      type: service
      expect: active
      verify: true
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
