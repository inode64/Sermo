name: pmie_farm
display_name: PCP Inference Engine Farm
category: observability
description: Performance Co-Pilot pmie farm service.
service:
  systemd:
    - pmie_farm
apps:
  - pmie_farm
variables:
  user: pcp
# Remediation policy for restart-if-inactive below. Same shape as the rest of the
# PCP family (pmcd, pmlogger): rare, backed off, and capped per day.
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
watches:
  service:
    check:
      type: service
      expect: active
      verify: true
  # Same reasoning as pmlogger_farm: the farm service supervises the non-primary
  # pmies through pmpause and listens on nothing, so no endpoint check can drive
  # its remediation. The unit ships Restart=always but systemd stops retrying for
  # good once its start limit is hit, so this adds the rate-limited retry.
  restart-if-inactive:
    check:
      type: service
      expect: active
    for:
      cycles: 3
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
