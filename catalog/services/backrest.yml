name: backrest
display_name: Backrest
category: storage
description: Backrest web UI/orchestrator for restic backups.
service:
  systemd:
    - backrest
  openrc:
    - backrest
apps:
  - backrest
restart_on_change:
  apps:
    - backrest
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  host: 127.0.0.1
  port: 9898
pidfile: /run/backrest.pid
processes:
  main:
    exe: ${backrest_binary}
    user: root
watches:
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: tcp
      host: ${host}
      port: ${port}
      timeout: 2s
  http:
    check:
      type: http
      url: http://${host}:${port}/
      expect_status:
        op: <
        value: 500
      timeout: 5s
  # Any running restic counts, not only backup/restore: a restart kills the
  # child mid-operation, which leaves a prune or check holding a stale
  # repository lock just like an interrupted backup. Matching the resolved exe
  # reads the daemon's process snapshot instead of scanning every command line,
  # a scan that ran past its timeout on hosts busy with the backup itself.
  backup-or-restore:
    check:
      type: process
      reports: state
      optional: true
      exe_any:
        - /usr/bin/restic
        - /usr/local/bin/restic
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
rules:
  block-restart-during-backup-or-restore:
    type: guard
    blocks: [restart, stop]
    if:
      active:
        check: backup-or-restore
    then:
      action: block
      message: "${display_name} restic operation is running"
