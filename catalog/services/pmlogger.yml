name: pmlogger
display_name: PCP Archive Logger
category: observability
description: Performance Co-Pilot primary archive logger.
service:
  systemd:
    - pmlogger
apps:
  - pmlogger
variables:
  host: 127.0.0.1
  port: 4330
  user: pcp
pidfile: /run/pcp/pmlogger.pid
processes:
  main:
    exe: ${pmlogger_binary}
    user: ${user}
watches:
  service:
    check:
      type: service
      expect: active
  restart-if-port-failed:
    check:
      type: tcp
      host: ${host}
      port: ${port}
      timeout: 2s
    for:
      cycles: 3
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-io-high:
    check:
      type: metric
      scope: service
      name: io
      op: '>'
      # 100 MB/s. The shipped thresholds used to be one host's live samples
      # (451 B/s for ssh, 32 MB/s for ceph-osd), so nearly every service alerted
      # on normal work. `io` is a rate in B/s and has no percentage form, so one
      # deliberately generous ceiling is the closest a packaged default gets to
      # true everywhere; a storage-plane host raises it in services.local/.
      value: 104857600
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} IO usage stayed above ${check.threshold} (current ${check.value})
