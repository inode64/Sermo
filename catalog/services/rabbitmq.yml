name: rabbitmq
display_name: RabbitMQ
category: messaging
type: queue
service:
  systemd:
    - rabbitmq-server
    - rabbitmq
  openrc:
    - rabbitmq
apps:
  - erlang
  - rabbitmq
restart_on_change:
  apps:
    - erlang
    - rabbitmq
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: rabbitmq
  host: 127.0.0.1
  port: 5672
# The broker writes its own pidfile, naming the Erlang VM. The init script's
# /run/rabbitmq.pid names the launcher shell above it, which would make a shell
# upgrade read as a replaced broker and restart it; it stays the fallback while
# the broker boots or runs under another node name.
pidfile:
  - /var/lib/rabbitmq/mnesia/rabbit@${hostname}.pid
  - /run/rabbitmq.pid
stop_policy:
  graceful_timeout: 60s
  term_timeout: 30s
  kill_only_if:
    users:
      - ${user}
    exe_any:
      - ${rabbitmq_binary}
watches:
  service:
    check:
      type: service
      expect: active
  restart-if-amqp-failed:
    check:
      type: amqp
      host: ${host}
      port: ${port}
      timeout: 3s
    for:
      cycles: 3
    then:
      action: restart
