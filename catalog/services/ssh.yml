name: ssh
display_name: OpenSSH
category: network
service:
  systemd:
    - sshd
    - ssh
  openrc:
    - sshd
apps:
  - ssh
restart_on_change:
  apps:
    - ssh
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: root
  port: 22
preflight:
  config:
    type: command
    command:
      - ${ssh_binary}
      - -t
    timeout: 30s
pidfile: /run/sshd.pid
processes:
  main:
    exe: ${ssh_binary}
    user: ${user}
  # Every SSH session hangs off the listener, and sshd's unit is KillMode=process
  # so a stop deliberately leaves the connected ones alive. Match a session by its
  # process title — `sshd-session: user@pts/0` or `sshd-session: user [priv]`, and
  # the `sshd:` spelling before OpenSSH 9.8 — never the listener, whose title is
  # `sshd: /usr/sbin/sshd -D [listener] …`. Delegation covers the rest of each
  # session from there, down to the user's shell and whatever it runs. Without it
  # the whole session tree counts as residuals of the stop, and a restart never
  # reaches its start phase while anyone is logged in.
  session:
    cmd: '^sshd(-session)?: [^ /]+(@| \[priv\])'
    delegated: true
reload:
  signal: HUP
watches:
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: tcp
      port: ${port}
  ssh:
    check:
      type: ssh
      port: ${port}
      timeout: 3s
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
  alert-if-io-high:
    check:
      type: metric
      scope: service
      name: io
      op: '>'
      # 100 MB/s. The shipped thresholds used to be one host's live samples
      # (451 B/s for ssh, 32 MB/s for ceph-osd), so nearly every service alerted
      # on normal work. `io` is a rate in B/s and has no percentage form, so one
      # deliberately generous ceiling is the closest a packaged default gets to
      # true everywhere; a storage-plane host raises it in services.local/.
      value: 104857600
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} IO usage stayed above ${check.threshold} (current ${check.value})
