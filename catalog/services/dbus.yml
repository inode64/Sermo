name: dbus
display_name: D-Bus
category: system
description: DBus Daemon
service:
  systemd:
    - dbus
    - dbus-daemon
  openrc:
    - dbus
    - dbus-daemon
apps:
  - dbus
restart_on_change:
  apps:
    - dbus
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: messagebus
  # sd_booted(): systemd is PID 1 when this directory exists.
  systemd_booted_path: /run/systemd/system
pidfile: /run/dbus.pid
rules:
  # Under systemd a running system bus cannot be replaced in place:
  # systemd-logind, NetworkManager, firewalld and other clients keep their dead
  # connection, and logins stop getting session scopes until each one is
  # restarted. A reboot loads a new bus. A failed or stopped bus may still be
  # started, so the guard needs the unit active.
  block-restart-under-systemd:
    type: guard
    blocks: [stop, restart]
    if:
      and:
        - file:
            path: ${systemd_booted_path}
        - service:
            state: active
    then:
      action: block
      message: >-
        ${display_name} is not restarted while systemd runs it: logind and other bus clients do not reconnect; reboot to load a new bus
processes:
  main:
    exe: ${dbus_binary}
    user: ${user}
watches:
  service:
    check:
      type: service
      expect: active
  dbus:
    check:
      type: dbus
      timeout: 3s
      verify: true
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
