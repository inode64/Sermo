name: systemd-machined
aliases:
  - machined
display_name: systemd-machined
category: virtualization
description: systemd virtual machine and container registration service.
service:
  systemd:
    - systemd-machined
variables:
  busctl_binary: /usr/bin/busctl
rules:
  block-stop-during-registered-machines:
    type: guard
    blocks: [stop, restart]
    if:
      not:
        command:
          command:
            - ${busctl_binary}
            - --system
            - --auto-start=no
            - --allow-interactive-authorization=no
            - call
            - org.freedesktop.machine1
            - /org/freedesktop/machine1
            - org.freedesktop.machine1.Manager
            - ListMachines
          expect_exit: 0
          expect_stdout: { op: '==', value: 'a(ssso) 0' }
          timeout: 5s
    then:
      action: block
      message: Machines are registered or cannot be inspected; stop and restart denied
watches:
  service:
    check:
      type: service
      expect: active
  dbus:
    check:
      type: dbus
      bus_name: org.freedesktop.machine1
      object_path: /org/freedesktop/machine1
      require_owner: true
      probe: introspect
      dbus_interface: org.freedesktop.machine1.Manager
      timeout: 5s
      verify: true
