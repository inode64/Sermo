name: rpc-statd
display_name: NFS Status Monitor
category: storage
service:
  systemd:
    - rpc-statd
  openrc:
    - rpc.statd
    - rpc-statd
apps:
  - rpc-statd
restart_on_change:
  apps:
    - rpc-statd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: nobody
pidfile: /run/rpc.statd.pid
processes:
  main:
    exe: ${rpc_statd_binary}
    user: ${user}
  # rpc.statd only drops to ${user} when the init options request it; stock
  # Gentoo OpenRC keeps it as root, and with just the dropped-privileges
  # selector the restart identity guard blocked every operation there.
  main-root:
    exe: ${rpc_statd_binary}
    user: root
watches:
  service:
    check:
      type: service
      expect: active
  # rpc.statd registers its port with rpcbind only when it starts, and a
  # restarted rpcbind forgets every registration: statd then keeps running but
  # NFS servers can no longer reach it for lock recovery. Asking rpcbind for the
  # NSM port and calling NSM there proves both, wherever statd listens, and only
  # a restart registers it again.
  restart-if-statd-failed:
    check:
      type: rpcbind
      host: 127.0.0.1
      transport: tcp
      program: 100024
      version: 1
      timeout: 5s
      verify: true
    for:
      cycles: 3
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
rules:
  # statd cannot register while the portmapper is down, so starting it then
  # only fails. Once rpcbind answers again, restart-if-statd-failed restarts
  # statd; a host whose rpcbind lists it in also_apply restarts it at once.
  block-without-portmapper:
    type: guard
    blocks:
      - start
      - restart
      - resume
    if:
      not:
        active:
          rpcbind:
            timeout: 5s
            host: 127.0.0.1
            transport: tcp
            program: 100000
            version: 2
    then:
      action: block
      message: RPC portmapper cannot be verified; recover rpcbind before restarting ${display_name}
