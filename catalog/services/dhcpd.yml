name: dhcpd
display_name: DHCP Server
category: network
service:
  systemd:
    - dhcpd
    - dhcpd4
  openrc:
    - dhcpd
apps:
  - dhcpd
restart_on_change:
  apps:
    - dhcpd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  port: 67
  user: dhcp
  config: /etc/dhcp/dhcpd.conf
preflight:
  config:
    type: command
    command:
      - ${dhcpd_binary}
      - -t
      - -cf
      - ${config}
    timeout: 30s
os:
  gentoo:
    pidfile: /run/dhcp/dhcpd.pid
  ubuntu:
    service:
      systemd:
        - isc-dhcp-server
    variables:
      user: dhcpd
    pidfile: /run/dhcp-server/dhcpd.pid
processes:
  main:
    exe: ${dhcpd_binary}
    user: ${user}
watches:
  service:
    check:
      type: service
      expect: active
  # No same-host dhcp probe: ISC dhcpd receives only via raw/LPF sockets on
  # physical interfaces (its UDP 0.0.0.0:67 socket is send-only) and emits
  # OFFERs through LPF, invisible to a local UDP socket — verified empirically
  # in loopback-unicast and interface-broadcast modes with a static
  # reservation's MAC. The optional probe therefore warned forever on every
  # dhcpd host. The dhcp check type remains available for host watches probing
  # a REMOTE dhcpd, where the wire round-trip is real.
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
