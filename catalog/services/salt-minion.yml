name: salt-minion
display_name: Salt Minion
category: system
description: Salt minion agent.
service: salt-minion
apps:
  - salt-minion
restart_on_change:
  apps:
    - salt-minion
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
pidfile: /run/salt-minion.pid
processes:
  main:
    # Salt runs through its Python wrapper on Gentoo, so its real executable is
    # the interpreter rather than /usr/bin/salt-minion.  This selector provides
    # discovery only; it cannot authorize signals to the shared interpreter.
    cmd: (^|[[:space:]])/usr/lib/python-exec/python[0-9.]+/salt-minion([[:space:]]|$)
    user: root
os:
  gentoo:
    # OpenRC runs Salt under supervise-daemon.  Its own pidfile is the only
    # strict identity Sermo may signal if OpenRC leaves a stale supervisor
    # behind; the Python minion and logger children remain discovery-only.
    # On Gentoo running systemd there is no supervisor at all, so the exact
    # selector is init-scoped: leaving it in place would make the restart
    # identity guard block every operation on a unit whose only processes
    # are the shared Python interpreter.
    pidfile:
      - /run/supervisor-salt-minion.pid
      - /run/salt-minion.pid
    processes:
      supervisor:
        exe: /usr/bin/supervise-daemon
        cmd: ^supervise-daemon salt-minion --start([[:space:]]|$)
        user: root
        enable_if:
          init: openrc
    stop_policy:
      force_kill: auto
      term_timeout: 5s
      kill_timeout: 5s
watches:
  service:
    check:
      type: service
      expect: active
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
