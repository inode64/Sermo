name: ntpd
display_name: NTP Daemon
category: network
description: Network Time Protocol Daemon
service: ntpd
apps:
  - ntpd
restart_on_change:
  apps:
    - ntpd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  port: 123
  user: ntp
  clock_check_interval: 5m
  ntp_server: time.cloudflare.com
  ntp_server_fallback: pool.ntp.org
  max_offset: 1s
  max_offset_step: 5s
  max_stratum: 4
  max_root_dispersion: 250ms
pidfile: /run/ntpd.pid
processes:
  main:
    exe: ${ntpd_binary}
    user: ${user}
  # Without `-u ntp:ntp` in the init options ntpd keeps running as root
  # (Gentoo's stock NTPD_OPTS="-g"). Both identities are exact; declaring only
  # the dropped-privileges one made the restart identity guard block every
  # operation on hosts whose ntpd runs as root.
  main-root:
    exe: ${ntpd_binary}
    user: root
watches:
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: ntp
      port: ${port}
  clock:
    interval: ${clock_check_interval}
    # Host wall-clock drift, alert-only and graphed. ntpd offers no local
    # read-only view of its own correction the way chronyd's command protocol
    # does, so this must query remote servers — point them at your own NTP
    # servers if you do not want the public pool.
    check:
      type: clock
      servers:
        - ${ntp_server}
        - ${ntp_server_fallback}
      max_offset: ${max_offset}
      max_stratum: ${max_stratum}
      max_root_dispersion: ${max_root_dispersion}
      unit: s
      optional: true
      timeout: 3s
  restart-if-clock-drifting:
    interval: ${clock_check_interval}
    # ntpd has no "step now" command — neither the NTP protocol nor ntpd's
    # control interface exposes one — so the forced correction is a restart:
    # with -g in its options ntpd steps once at startup. This goes through the
    # safe operation engine (locks, guards, preflight) and the service's
    # policy.cooldown, unlike chrony's native then.makestep.
    #
    # Two servers and a long window on purpose: a rule fires on *any* check
    # failure, so a single unreachable server must not restart the daemon.
    check:
      type: clock
      servers:
        - ${ntp_server}
        - ${ntp_server_fallback}
      max_offset: ${max_offset_step}
      max_stratum: ${max_stratum}
      optional: true
      timeout: 3s
    for:
      duration: 15m
    then:
      action: restart
      message: >-
        During ${rule.duration}, the clock check kept failing (offset above ${max_offset_step}, or no usable NTP sample); restarting ${display_name} to resynchronize
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
