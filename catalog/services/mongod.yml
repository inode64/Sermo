name: mongod
display_name: MongoDB
category: database
description: Mongo DB
service: mongod
apps:
  - mongod
restart_on_change:
  apps:
    - mongod
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  host: 127.0.0.1
  port: 27017
  config: /etc/mongod.conf
  # The upstream RPM packages run mongod as `mongod`; the Debian/Ubuntu packages
  # and Gentoo as `mongodb`.
  user: mongod
os:
  debian:
    variables:
      user: mongodb
  ubuntu:
    variables:
      user: mongodb
  gentoo:
    variables:
      user: mongodb
processes:
  mongod:
    exe: ${mongod_binary}
    user: ${user}
# A database stop flushes and checkpoints: give it a long graceful window, and
# SIGKILL only the exact daemon binary under its own user if it still hangs.
stop_policy:
  graceful_timeout: 120s
  term_timeout: 60s
  kill_only_if:
    users:
      - ${user}
    exe_any:
      - ${mongod_binary}
preflight:
  config:
    type: command
    command:
      - ${mongod_binary}
      - --config
      - ${config}
      - --outputConfig
    timeout: 15s
config_files:
  - ${config}
watches:
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: tcp
      host: ${host}
      port: ${port}
  mongodb:
    check:
      type: mongodb
      verify: true
      host: ${host}
      port: ${port}
      timeout: 3s
