name: proftpd
display_name: ProFTPD
category: network
service: proftpd
apps:
  - proftpd
restart_on_change:
  # Every session is a fork of the master and runs on the libraries it loaded.
  libraries:
    - glibc
    - openssl
    - zlib
    - zstd
    - pcre2
    - libxcrypt
    - mysql-client
  apps:
    - proftpd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
    library: >-
      ${display_name} will restart after library change: ${change.library} (${change.path})
variables:
  user: root
  port: 21
preflight:
  config:
    type: command
    command:
      - ${proftpd_binary}
      - --configtest
    timeout: 30s
pidfile: /run/proftpd/proftpd.pid
processes:
  main:
    exe: ${proftpd_binary}
    user: ${user}
reload:
  signal: HUP
watches:
  # Libraries the processes still map from before an update, including those
  # restart_on_change does not list (libcap, libacl, the GCC runtime).
  # Advisory: restart_on_change drives restarts.
  alert-if-libraries-replaced:
    check:
      type: stale_libraries
      interval: 5m
      severity: warning
    then:
      action: alert
      message: >-
        ${display_name} still uses libraries replaced on disk; restart it to load the updated versions
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: tcp
      port: ${port}
  ftp:
    check:
      type: ftp
      port: ${port}
      timeout: 3s
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
