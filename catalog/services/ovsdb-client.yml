name: ovsdb-client
display_name: Open vSwitch Client
category: virtualization
# Tied to the same OVS control socket as ovsdb-server, so restart churn during
# an OVS event compounds the dataplane risk. A replaced binary is alerted and
# notified but never restarted automatically. This governs that trigger only —
# a manual restart and remediation for a real failure are unaffected.
restart_on_stale_binary: false
service: ovsdb-client
apps:
  - ovsdb-client
restart_on_change:
  apps:
    - ovsdb-client
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
watches:
  service:
    check:
      type: service
      expect: active
  openvswitch:
    check:
      type: openvswitch
      socket: /run/openvswitch/db.sock
      timeout: 5s
      optional: true
      verify: true
