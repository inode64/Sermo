name: bitbucketrunner
display_name: Bitbucket Pipelines Runner
category: vpn
description: Atlassian Bitbucket self-hosted Pipelines runner.
service:
  systemd:
    - bitbucketrunner
  openrc:
    - bitbucketrunner
# The runner is a jar its unit starts through the java launcher. Linking the
# runtime names the program a restart starts: once a JDK upgrade removes the
# versioned directory the JVM ran from, the process reads as running a replaced
# binary, which a restart renews, rather than an uninstalled one.
apps:
  - java
watches:
  service:
    check:
      type: service
      expect: active
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 10m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
