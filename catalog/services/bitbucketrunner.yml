name: bitbucketrunner
display_name: Bitbucket Pipelines Runner
category: vpn
description: Atlassian Bitbucket self-hosted Pipelines runner.
service:
  systemd:
    - bitbucketrunner
  openrc:
    - bitbucketrunner
watches:
  service:
    check:
      type: service
      expect: active
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 10m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
