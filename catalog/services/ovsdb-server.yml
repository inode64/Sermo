name: ovsdb-server
display_name: Open vSwitch Database Server
category: virtualization
variables:
  database: /var/lib/openvswitch/conf.db
  socket: /run/openvswitch/db.sock
  schema: /usr/share/openvswitch/vswitch.ovsschema
# vswitchd loses its connection to the configuration database on restart and can
# flap or drop bridge config, so a replaced binary is alerted and notified but
# never restarted automatically. This governs that trigger only — a manual
# restart and remediation for a real failure are unaffected.
restart_on_stale_binary: false
service:
  systemd:
    - ovsdb-server
  openrc:
    - ovsdb-server
apps:
  - ovsdb-server
  - ovsdb-client
  - ovsdb-tool
restart_on_change:
  apps:
    - ovsdb-server
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
processes:
  main:
    exe: ${ovsdb_server_binary}
    user: root
watches:
  service:
    check:
      type: service
      expect: active
  openvswitch:
    check:
      type: openvswitch
      socket: ${socket}
      timeout: 3s
  # ovsdb-client compares the schema served by the live database with the
  # packaged schema without converting or otherwise modifying either one.
  schema-current:
    interval: 10m
    check:
      type: command
      command:
        - ${ovsdb_client_binary}
        - needs-conversion
        - "unix:${socket}"
        - ${schema}
      expect_stdout: { op: "==", value: "no" }
      timeout: 10s
  # show-log parses every record without modifying the database and supports
  # standalone, active-backup and clustered OVSDB file formats.
  database-integrity:
    interval: 24h
    check:
      type: command
      command:
        - ${ovsdb_tool_binary}
        - show-log
        - ${database}
      timeout: 2m
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
