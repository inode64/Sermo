name: mysql
display_name: MySQL
category: database
type: database
service:
  systemd:
    - mysql
    - mysqld
  openrc:
    - mysql
    - mysqld
apps:
  - mysql
restart_on_change:
  apps:
    - mysql
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: mysql
  backup_user: mysql
  host: 127.0.0.1
  port: 3306
  # alert-if-query-long-running connects the way the mysql client run by root
  # does: over the socket, with the [client] credentials of this option file
  # (user defaults to root). A missing file just means no password.
  db_socket: /run/mysqld/mysqld.sock
  defaults_file: /root/.my.cnf
  # One warning per statement running longer than this.
  long_query_duration: 5m
  # Binary logs (and relay logs) under the data directory, a glob summed by
  # alert-if-binlog-large: mariadb-bin.000123, mysql-bin.000123,
  # <host>-bin.000123, binlog.000123 and the relay-bin files all match. The
  # directory before the first wildcard must exist, so a wrong datadir is
  # reported unavailable instead of "no binlogs". One error incident opens
  # while they take more than binlog_max_size in total, or after they grow by
  # binlog_grow_by within binlog_grow_within (a bulk load, or a replica that
  # stopped purging, fills the volume fast). Set a limit's variables to "" to
  # switch that limit off.
  binlog_pattern: "/var/lib/mysql/*bin*.[0-9]*"
  binlog_max_size: 20G
  binlog_grow_by: 1G
  binlog_grow_within: 30m
  # The total moves slowly next to those limits: sampling it every 5 minutes
  # keeps the glob and one stat per binlog off every worker cycle.
  binlog_check_interval: 5m
  memory_alert_threshold: 80%
  # The alert escalates from warning to error past this share of host memory.
  memory_error_threshold: 90%
  config:
    - /etc/mysql/my.cnf
    - /etc/my.cnf
socket:
  path: ${db_socket}
  optional: true
preflight:
  config:
    type: command
    command:
      - ${mysql_binary}
      - --defaults-file=${config}
      - --help
      - --verbose
    timeout: 15s
# The `mysql` unit is MariaDB's unit name too (Gentoo ships dev-db/mariadb with
# /etc/init.d/mysql and /usr/sbin/mysqld), and MariaDB's packaged my.cnf writes
# mariadb.pid. Accept both, exactly as mariadb.yml already accepts mysqld.pid:
# either file, when it points at a live process, proves the same daemon.
pidfile:
  - /run/mysqld/mysqld.pid
  - /run/mysqld/mariadb.pid
processes:
  mysqld:
    exe: ${mysql_binary}
    user: ${user}
config_files:
  - ${config}
stop_policy:
  graceful_timeout: 120s
  term_timeout: 60s
  kill_only_if:
    users:
      - ${user}
    exe_any:
      - ${mysql_binary}
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
rules:
  block-restart-during-backup:
    type: guard
    blocks:
      - restart
      - stop
    if:
      active:
        check: backup
    then:
      action: block
      message: ${display_name} backup is running; stop and restart denied
watches:
  # One warning per statement that outlives long_query_duration, with its
  # text; the Sessions panel lists the running statements and can cancel one.
  alert-if-query-long-running:
    check:
      type: db_queries
      engine: mysql
      socket: ${db_socket}
      defaults_file: ${defaults_file}
      min_duration: ${long_query_duration}
      severity: warning
  # One error incident while the binary logs are over binlog_max_size in
  # total or have grown binlog_grow_by within binlog_grow_within.
  alert-if-binlog-large:
    interval: ${binlog_check_interval}
    check:
      type: size
      path: ${binlog_pattern}
      max: ${binlog_max_size}
      grow_by: ${binlog_grow_by}
      within: ${binlog_grow_within}
      severity: error
  service:
    check:
      type: service
      expect: active
  memory:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 60%
      optional: true
  backup:
    check:
      type: process
      reports: state
      optional: true
      exe_any:
        - /usr/bin/mysqldump
        - /usr/bin/mariadb-dump
        - /usr/bin/mysqlpump
        - /usr/bin/mysqlbackup
        - /usr/bin/xtrabackup
        - /usr/bin/wal-g-mysql
        - /usr/local/bin/wal-g-mysql
        - /usr/bin/wal-g
        - /usr/local/bin/wal-g
      user: ${backup_user}
      state: running
  restart-if-tcp-failed:
    check:
      type: tcp
      host: ${host}
      port: ${port}
      timeout: 3s
    for:
      cycles: 3
    then:
      action: restart
  restart-if-ping-failed:
    check:
      type: mysql
      host: ${host}
      port: ${port}
      timeout: 5s
      verify: true
    for:
      cycles: 3
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: ${memory_alert_threshold}
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: "${memory_error_threshold}" }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
  alert-if-io-high:
    check:
      type: metric
      scope: service
      name: io
      op: '>'
      # 100 MB/s. The shipped thresholds used to be one host's live samples
      # (451 B/s for ssh, 32 MB/s for ceph-osd), so nearly every service alerted
      # on normal work. `io` is a rate in B/s and has no percentage form, so one
      # deliberately generous ceiling is the closest a packaged default gets to
      # true everywhere; a storage-plane host raises it in services.local/.
      value: 104857600
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} IO usage stayed above ${check.threshold} (current ${check.value})
