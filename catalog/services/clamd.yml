name: clamd
display_name: ClamAV Daemon
category: security
service:
  systemd:
    - clamd
    - clamav-daemon
  openrc:
    - clamd
apps:
  - clamd
restart_on_change:
  apps:
    - clamd
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: root
  config:
    - /etc/clamav/clamd.conf
    - /etc/clamd.conf
  # clamd's LocalSocket path is deployment-specific (Gentoo ships clamd.sock,
  # Debian clamd.ctl): read the daemon's own config instead of guessing, with
  # the Debian convention as the last-resort default.
  clamd_socket:
    from_file: ${config}
    pattern: (?m)^\s*LocalSocket\s+(\S+)
    default: /run/clamav/clamd.ctl
pidfile:
  - /run/clamd.pid
  - /run/clamav/clamd.pid
processes:
  main:
    exe: ${clamd_binary}
    user: ${user}
watches:
  service:
    check:
      type: service
      expect: active
  clamd:
    # Optional: the socket path varies by config (LocalSocket), so a mismatch
    # must not flip an active clamd to failed; service + pidfile are authoritative.
    check:
      type: clamd
      socket: ${clamd_socket}
      timeout: 3s
      optional: true
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
