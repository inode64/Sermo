name: cloudflared
display_name: Cloudflare Tunnel
category: vpn
description: Cloudflare Tunnel daemon (cloudflared)
type: tunnel
service:
  systemd:
    - cloudflared
  openrc:
    - cloudflared
apps:
  - cloudflared
restart_on_change:
  apps:
    - cloudflared
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  user: cloudflared
  host: 127.0.0.1
  port: 60123
  config: /etc/cloudflared/config.yml
config_files:
  - ${config}
preflight:
  config:
    # `tunnel ingress validate` validates locally declared ingress rules and
    # nothing else, so on a remotely-managed tunnel — whose config.yml carries a
    # `token:` and no ingress at all, the rules living in Cloudflare's dashboard —
    # it exits 1 with "The config file doesn't contain any ingress rules". A
    # failed preflight blocks every operation, so that turned a healthy tunnel
    # into one Sermo could not restart. Gate the check on the config actually
    # declaring ingress; a missing file or absent key prunes it, which is the
    # same fail-safe the previous `test ! -e` shell guard provided, natively.
    # `enable_if` is evaluated before ${var} expansion, so `file` must repeat the
    # literal default of `config`; a host that moves the file overrides
    # `preflight.config.enable_if.file` alongside `config`.
    enable_if:
      file: /etc/cloudflared/config.yml
      key: ingress
      matches: .*
    type: command
    command:
      - ${cloudflared_binary}
      - --config
      - ${config}
      - tunnel
      - ingress
      - validate
    timeout: 30s
processes:
  main:
    exe: ${cloudflared_binary}
    user: ${user}
stop_policy:
  kill_only_if:
    users:
      - ${user}
    exe_any:
      - ${cloudflared_binary}
watches:
  restart-if-inactive:
    check:
      type: service
      expect: active
    for:
      cycles: 3
    then:
      action: restart
  restart-if-protocol-failed:
    check:
      type: cloudflared
      host: ${host}
      port: ${port}
      timeout: 3s
    for:
      cycles: 3
    then:
      action: restart
