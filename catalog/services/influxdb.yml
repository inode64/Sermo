name: influxdb
display_name: InfluxDB
category: database
description: InfluxDB time-series database.
type: database
service:
  systemd:
    - influxdb
  openrc:
    - influxdb
apps:
  - influxdb
restart_on_change:
  apps:
    - influxdb
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  host: 127.0.0.1
  port: 8086
  config: /etc/influxdb2/config.toml
  user: influxdb
processes:
  influxd:
    exe: ${influxdb_binary}
    user: ${user}
# A database stop flushes and checkpoints: give it a long graceful window, and
# SIGKILL only the exact daemon binary under its own user if it still hangs.
stop_policy:
  graceful_timeout: 120s
  term_timeout: 60s
  kill_only_if:
    users:
      - ${user}
    exe_any:
      - ${influxdb_binary}
config_files:
  - ${config}
preflight:
  config:
    type: command
    command:
      - ${influxdb_binary}
      - config
      - validate
      - --config
      - ${config}
    timeout: 30s
pidfile: /run/supervise-influxdb.pid
watches:
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: tcp
      host: ${host}
      port: ${port}
      timeout: 2s
  health:
    check:
      type: influxdb
      host: ${host}
      port: ${port}
      timeout: 3s
