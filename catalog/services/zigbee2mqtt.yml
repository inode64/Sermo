name: zigbee2mqtt
display_name: Zigbee2MQTT
category: web
description: Zigbee to MQTT bridge.
service: zigbee2mqtt
apps:
  - node
restart_on_change:
  apps:
    - node
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
pidfile: /run/zigbee2mqtt.pid
# Zigbee2MQTT is a Node.js program: the process runs node with the launcher as
# its argument. systemd proves which processes are the unit's by its control
# group, whatever the install layout (the packaged launcher, or `node index.js`
# from a checkout). OpenRC offers no such proof, so there the packaged layout
# is the daemon's identity: without one, a stop the init script gives up on
# leaves a process Sermo can neither name nor show gone, and the restart fails.
processes:
  main:
    exe: ${node_binary}
    cmd: '(^|/)node ${launcher}([[:space:]]|$)'
    user: ${user}
    enable_if:
      init: openrc
# On SIGTERM the bridge backs up the coordinator before it exits, reading its
# tables over the serial link: about 20 seconds with a hundred devices, longer
# on a larger network. A stop that waits less reports an error while the
# process is still on its way out, or kills it halfway through the backup.
stop_policy:
  graceful_timeout: 90s
  term_timeout: 15s
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
variables:
  port: 8080
  user: zigbee2mqtt
  launcher: ${bindir}/zigbee2mqtt
watches:
  service:
    check:
      type: service
      expect: active
  restart-if-http-failed:
    check:
      type: http
      url: http://127.0.0.1:${port}/
      expect_status:
        op: <
        value: 500
      timeout: 5s
      optional: true
      verify: true
    for:
      cycles: 3
    then:
      action: restart
  restart-if-worker-thread-hot:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 6m
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 10m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
