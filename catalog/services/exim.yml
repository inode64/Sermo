name: exim
display_name: Exim
category: messaging
description: Gestor de correo SMTP Exim
service: exim
apps:
  - exim
restart_on_change:
  apps:
    - exim
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
variables:
  host: 127.0.0.1
  port: 25
  config: /etc/exim/exim.conf
  # Implicit TLS ("SMTPS") is optional in Exim and off by default: the daemon
  # only wraps a port in TLS on connect when tls_on_connect_ports names it. Read
  # the port the host really configured instead of assuming 465.
  tls_port:
    from_file: ${config}
    pattern: (?m)^\s*tls_on_connect_ports\s*[=:]\s*(\d+)
    default: 465
  user: mail
  spool_dir: /var/spool/exim
  db_dir: /var/spool/exim/db
  # Exim 4.99+ names the SQLite hints table tblblob. Older supported Exim
  # releases use tbl; fleet discovery overrides each table independently from
  # read-only sqlite_schema evidence.
  callout_db_table: tblblob
  retry_db_table: tblblob
  db_cleanup_record_limit: "100"
  db_cleanup_age: 10d
  db_cleanup_interval: 6h
  db_cleanup_timeout: 5m
  msglog_dir: /var/spool/exim/msglog
  msglog_backlog_limit: "300"
  msglog_growth_limit: "200"
  msglog_growth_window: 2m
preflight:
  config:
    type: command
    command:
      - ${exim_binary}
      - -bV
    timeout: 10s
pidfile: /run/exim.pid
# Operator buttons: explicit admin commands the dashboard offers for this
# service. `exim -qff` forces an immediate delivery attempt for every queued
# message, frozen ones included — the manual "flush the queue now". Each
# exim_tidydb invocation maintains one hints database and may lock it until the
# bounded command completes, so callout and retry stay separate actions.
buttons:
  flush-queue:
    label: "Flush queue"
    command:
      - ${exim_binary}
      - -qff
    timeout: 5m
  tidy-callout-db:
    label: "Tidy callout DB"
    command:
      - ${exim_tidydb}
      - -t
      - ${db_cleanup_age}
      - ${spool_dir}
      - callout
    timeout: ${db_cleanup_timeout}
  tidy-retry-db:
    label: "Tidy retry DB"
    command:
      - ${exim_tidydb}
      - -t
      - ${db_cleanup_age}
      - ${spool_dir}
      - retry
    timeout: ${db_cleanup_timeout}
processes:
  main:
    exe: ${exim_binary}
    user: ${user}
reload:
  signal: HUP
watches:
  service:
    check:
      type: service
      expect: active
  port:
    check:
      type: tcp
      port: ${port}
  smtp:
    check:
      type: smtp
      port: ${port}
      timeout: 3s
  # `exim -bpc` prints the number of queued messages; `unit:` turns that number
  # into the check's `value` series, so the service carries a queue-depth graph.
  queue:
    interval: 1m
    check:
      type: command
      command:
        - ${exim_binary}
        - -bpc
      unit: messages
      timeout: 15s
  cert:
    # A cert check opens a TLS connection, so it can only see a port that
    # terminates TLS on connect. An Exim with `daemon_smtp_ports = 25` and no
    # tls_on_connect_ports offers STARTTLS on 25 and listens nowhere else, so
    # probing 465 failed forever on a perfectly healthy server. Gate the check on
    # the host actually configuring implicit TLS; a missing file or an absent key
    # prunes it, the same fail-safe cloudflared's ingress gate uses. `enable_if`
    # is evaluated before ${var} expansion, so `file` repeats the literal default
    # of `config`; a host that moves exim.conf overrides both.
    enable_if:
      file: /etc/exim/exim.conf
      key: tls_on_connect_ports
      matches: '[0-9]'
    check:
      type: cert
      optional: true
      host: ${host}
      port: ${tls_port}
      cert_verify: false
      expires_in_days: 21
      timeout: 5s
  alert-if-msglog-backlog-high:
    check:
      type: count
      path: ${msglog_dir}
      of: file
      count:
        op: '>'
        value: ${msglog_backlog_limit}
      optional: true
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} msglog backlog stayed above ${msglog_backlog_limit} files (current ${check.value})
  alert-if-msglog-backlog-growing-fast:
    check:
      type: count
      path: ${msglog_dir}
      of: file
      delta:
        op: '>'
        value: ${msglog_growth_limit}
      within: ${msglog_growth_window}
      optional: true
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} msglog backlog grew by more than ${msglog_growth_limit} files in ${msglog_growth_window} (current growth ${check.value})
  tidy-callout-db-if-large:
    display_name: "Callout DB records"
    interval: ${db_cleanup_interval}
    check:
      type: sql
      engine: sqlite
      path: ${db_dir}/callout
      query: "SELECT count(*) FROM ${callout_db_table}"
      op: '>'
      value: ${db_cleanup_record_limit}
      unit: records
      summary: "Exim callout DB has ${value} records (limit ${check.value}); cleanup age ${db_cleanup_age}"
      optional: true
    then:
      hook:
        command:
          - ${exim_tidydb}
          - -t
          - ${db_cleanup_age}
          - ${spool_dir}
          - callout
        timeout: ${db_cleanup_timeout}
        expect_exit: 0
  tidy-retry-db-if-large:
    display_name: "Retry DB records"
    interval: ${db_cleanup_interval}
    check:
      type: sql
      engine: sqlite
      path: ${db_dir}/retry
      query: "SELECT count(*) FROM ${retry_db_table}"
      op: '>'
      value: ${db_cleanup_record_limit}
      unit: records
      summary: "Exim retry DB has ${value} records (limit ${check.value}); cleanup age ${db_cleanup_age}"
      optional: true
    then:
      hook:
        command:
          - ${exim_tidydb}
          - -t
          - ${db_cleanup_age}
          - ${spool_dir}
          - retry
        timeout: ${db_cleanup_timeout}
        expect_exit: 0
  restart-if-worker-thread-hot:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 6m
    then:
      action: restart
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
  alert-if-io-high:
    check:
      type: metric
      scope: service
      name: io
      op: '>'
      # 100 MB/s. The shipped thresholds used to be one host's live samples
      # (451 B/s for ssh, 32 MB/s for ceph-osd), so nearly every service alerted
      # on normal work. `io` is a rate in B/s and has no percentage form, so one
      # deliberately generous ceiling is the closest a packaged default gets to
      # true everywhere; a storage-plane host raises it in services.local/.
      value: 104857600
      optional: true
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} IO usage stayed above ${check.threshold} (current ${check.value})
