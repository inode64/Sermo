name: systemd-networkd
aliases:
  - networkd
display_name: systemd-networkd
category: network
description: systemd network configuration service.
service:
  systemd:
    - systemd-networkd
apps:
  - systemd-networkd
variables:
  user: systemd-network
# Socket or D-Bus activation can replace the daemon during stop. Its exact
# identity lets the operation engine verify that new generation safely.
processes:
  main:
    exe: ${systemd_networkd_binary}
    user: ${user}
watches:
  service:
    check:
      type: service
      expect: active
  dbus:
    check:
      type: dbus
      bus_name: org.freedesktop.network1
      object_path: /org/freedesktop/network1
      require_owner: true
      probe: property
      dbus_interface: org.freedesktop.network1.Manager
      property: OperationalState
      timeout: 5s
      verify: true
