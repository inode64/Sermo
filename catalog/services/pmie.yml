name: pmie
display_name: PCP Inference Engine
category: observability
description: Performance Co-Pilot inference engine daemon.
service:
  systemd:
    - pmie
# pmie.service is BindsTo= pmie_farm, which is PartOf= it. An isolated
# restart leaves the farm on the binary it started with, and an isolated
# farm restart stops pmie for good: the stack is only renewed whole
# through the init graph. Its start also pulls pmcd up (Wants=).
allow_dependencies: true
apps:
  - pmie
variables:
  user: pcp
pidfile: /run/pcp/pmie.pid
processes:
  main:
    exe: ${pmie_binary}
    user: ${user}
watches:
  service:
    check:
      type: service
      expect: active
  process:
    check:
      # Best-effort: after a PCP package update the running pmie's exe reads as
      # "(deleted)" until restart and cannot match by exact exe (a deliberate
      # kill-safety rule), so this must not hard-fail. service + pidfile are the
      # authoritative liveness signals.
      type: process
      exe: ${pmie_binary}
      user: ${user}
      state: running
      optional: true
      requires:
        - service
      verify: true
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
