name: avahi
display_name: Avahi
category: network
description: Zero Configuration Networking
service:
  systemd:
    - avahi
    - avahi-daemon
  openrc:
    - avahi
    - avahi-daemon
apps:
  - avahi
# Identity for residual detection: on OpenRC a failed `avahi-daemon --kill`
# can leave the daemon running while the init script reports stopped; without
# a pidfile and an exact selector Sermo cannot see or report that survivor,
# so a stop read as clean while the old daemon kept the D-Bus name and the
# next start failed with "Daemon already running".
pidfile: /run/avahi-daemon/pid
processes:
  main:
    exe: ${avahi_binary}
    user: avahi
restart_on_change:
  apps:
    - avahi
  messages:
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
watches:
  service:
    check:
      type: service
      expect: active
  avahi:
    check:
      type: avahi
      timeout: 3s
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
