name: redis
display_name: Redis
category: database
type: cache
service:
  systemd:
    - redis
    - redis-server
  openrc:
    - redis
    - redis-server
apps:
  - redis
variables:
  user: redis
  host: 127.0.0.1
  port: 6379
  maxmemory_used_limit: 90
pidfile:
  - /run/redis/redis.pid
  - /run/redis.pid
processes:
  redis:
    exe: ${redis_binary}
    user: ${user}
config_files:
  - /etc/redis/redis.conf
  - /etc/redis.conf
stop_policy:
  graceful_timeout: 90s
  term_timeout: 60s
  kill_only_if:
    users:
      - ${user}
    exe_any:
      - ${redis_binary}
policy:
  cooldown: 15m
  max_actions: 2
  max_actions_window: 1h
  backoff:
    initial: 15m
    max: 1h
restart_on_change:
  paths:
    - /etc/redis/redis.conf
    - /etc/redis.conf
  apps:
    - redis
  messages:
    path: >-
      ${display_name} will restart after config change: ${change.path}
    app: >-
      ${display_name} will restart after version change of ${change.app}: ${change.old_version} -> ${change.new_version}
watches:
  service:
    check:
      type: service
      expect: active
  restart-if-worker-thread-hot:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
    for:
      duration: 6m
    then:
      action: restart
  restart-if-tcp-failed:
    check:
      type: tcp
      host: ${host}
      port: ${port}
      timeout: 2s
    for:
      cycles: 3
    then:
      action: restart
  restart-if-ping-failed:
    check:
      type: redis
      host: ${host}
      port: ${port}
      timeout: 3s
      verify: true
    for:
      cycles: 3
    then:
      action: restart
  alert-if-persistence-failed:
    check:
      type: redis
      host: ${host}
      port: ${port}
      timeout: 3s
      expect:
        rdb_last_bgsave_status: ok
    then:
      action: alert
      message: ${display_name} persistence status is not ok
  alert-if-memory-high:
    check:
      type: metric
      scope: service
      name: memory
      op: '>'
      value: 30%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 50% }
    for:
      duration: 4m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} memory usage stayed above ${check.threshold} (current ${check.value})
  alert-if-cpu-thread-high:
    check:
      type: metric
      scope: service
      name: cpu_thread
      op: '>'
      value: 90%
      optional: true
      severity: warning
      levels:
        error: { op: '>', value: 98% }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} single-thread CPU usage stayed above ${check.threshold} (current ${check.value})
  # Enable where reaching maxmemory hurts: under `noeviction` writes are
  # rejected, and a store whose keys must survive (sessions) loses them to
  # eviction. A pure LRU cache sits at its limit by design. The field reads 0
  # when no maxmemory is configured.
  alert-if-maxmemory-near-limit:
    enabled: false
    check:
      type: redis
      host: ${host}
      port: ${port}
      timeout: 3s
      severity: warning
      expect:
        maxmemory_used_pct: { op: "<", value: "${maxmemory_used_limit}" }
    for:
      duration: 5m
    then:
      action: alert
      message: >-
        During ${rule.duration}, ${display_name} used memory stayed at or above ${maxmemory_used_limit}% of maxmemory
  # Enable on instances using appendonly; INFO omits this field otherwise.
  alert-if-aof-write-failed:
    enabled: false
    check:
      type: redis
      host: ${host}
      port: ${port}
      timeout: 3s
      expect:
        aof_last_write_status: ok
    then:
      action: alert
      message: ${display_name} AOF write status is not ok
