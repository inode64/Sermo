name: libevent
display_name: "libevent"
description: "Event notification library; a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libevent-2.1.so.7"
    - "/lib64/libevent-2.1.so.7"
    - "/usr/lib/*-linux-gnu*/libevent-2.1.so.7"
    - "/lib/*-linux-gnu*/libevent-2.1.so.7"
    - "/usr/lib/libevent-2.1.so.7"
    - "/lib/libevent-2.1.so.7"
    - "/usr/lib/*-linux-gnu*/libevent-2*.so*"
    - "/usr/lib/libevent-2*.so*"
preflight:
  file: { type: file, path: "${binary}" }
