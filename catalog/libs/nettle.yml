name: nettle
display_name: "Nettle"
description: "Nettle low-level cryptography library; a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libnettle.so.8"
    - "/lib64/libnettle.so.8"
    - "/usr/lib/*-linux-gnu*/libnettle.so.8"
    - "/lib/*-linux-gnu*/libnettle.so.8"
    - "/usr/lib/libnettle.so.8"
    - "/lib/libnettle.so.8"
preflight:
  file: { type: file, path: "${binary}" }
