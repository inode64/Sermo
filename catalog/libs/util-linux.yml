name: util-linux
display_name: "util-linux libblkid"
description: "util-linux block-device id library (libblkid); a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libblkid.so.1"
    - "/lib64/libblkid.so.1"
    - "/usr/lib/*-linux-gnu*/libblkid.so.1"
    - "/lib/*-linux-gnu*/libblkid.so.1"
    - "/usr/lib/libblkid.so.1"
    - "/lib/libblkid.so.1"
preflight:
  file: { type: file, path: "${binary}" }
