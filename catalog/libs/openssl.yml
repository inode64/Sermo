name: openssl
display_name: "OpenSSL libcrypto"
description: "OpenSSL cryptography/TLS library (libcrypto/libssl); a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libcrypto.so.3"
    - "/lib64/libcrypto.so.3"
    - "/usr/lib/*-linux-gnu*/libcrypto.so.3"
    - "/lib/*-linux-gnu*/libcrypto.so.3"
    - "/usr/lib/libcrypto.so.3"
    - "/lib/libcrypto.so.3"
    - "/usr/lib/*-linux-gnu*/libcrypto.so.1.1"
    - "/usr/lib/libcrypto.so.1.1"
preflight:
  file: { type: file, path: "${binary}" }
