name: zstd
display_name: "Zstandard"
description: "Zstandard compression library; a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libzstd.so.1"
    - "/lib64/libzstd.so.1"
    - "/usr/lib/*-linux-gnu*/libzstd.so.1"
    - "/lib/*-linux-gnu*/libzstd.so.1"
    - "/usr/lib/libzstd.so.1"
    - "/lib/libzstd.so.1"
preflight:
  file: { type: file, path: "${binary}" }
