name: udev
display_name: "libudev"
description: "udev device-management library (libudev); a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libudev.so.1"
    - "/lib64/libudev.so.1"
    - "/usr/lib/*-linux-gnu*/libudev.so.1"
    - "/lib/*-linux-gnu*/libudev.so.1"
    - "/usr/lib/libudev.so.1"
    - "/lib/libudev.so.1"
preflight:
  file: { type: file, path: "${binary}" }
