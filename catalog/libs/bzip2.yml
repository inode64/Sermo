name: bzip2
display_name: "bzip2 library"
description: "bzip2 compression library; a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libbz2.so.1"
    - "/lib64/libbz2.so.1"
    - "/usr/lib/*-linux-gnu*/libbz2.so.1"
    - "/lib/*-linux-gnu*/libbz2.so.1"
    - "/usr/lib/libbz2.so.1"
    - "/lib/libbz2.so.1"
    - "/usr/lib/*-linux-gnu*/libbz2.so.1.0"
    - "/usr/lib/libbz2.so.1.0"
preflight:
  file: { type: file, path: "${binary}" }
