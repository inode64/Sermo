name: c-ares
display_name: "c-ares"
description: "Asynchronous DNS resolver library; a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libcares.so.2"
    - "/lib64/libcares.so.2"
    - "/usr/lib/*-linux-gnu*/libcares.so.2"
    - "/lib/*-linux-gnu*/libcares.so.2"
    - "/usr/lib/libcares.so.2"
    - "/lib/libcares.so.2"
preflight:
  file: { type: file, path: "${binary}" }
