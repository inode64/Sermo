name: liburing
display_name: "liburing"
description: "Linux io_uring library; a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/liburing.so.2"
    - "/lib64/liburing.so.2"
    - "/usr/lib/*-linux-gnu*/liburing.so.2"
    - "/lib/*-linux-gnu*/liburing.so.2"
    - "/usr/lib/liburing.so.2"
    - "/lib/liburing.so.2"
preflight:
  file: { type: file, path: "${binary}" }
