name: brotli
display_name: "Brotli"
description: "Brotli compression library (libbrotlicommon); a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libbrotlicommon.so.1"
    - "/lib64/libbrotlicommon.so.1"
    - "/usr/lib/*-linux-gnu*/libbrotlicommon.so.1"
    - "/lib/*-linux-gnu*/libbrotlicommon.so.1"
    - "/usr/lib/libbrotlicommon.so.1"
    - "/lib/libbrotlicommon.so.1"
preflight:
  file: { type: file, path: "${binary}" }
