name: expat
display_name: "Expat"
description: "Expat XML parsing library; a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libexpat.so.1"
    - "/lib64/libexpat.so.1"
    - "/usr/lib/*-linux-gnu*/libexpat.so.1"
    - "/lib/*-linux-gnu*/libexpat.so.1"
    - "/usr/lib/libexpat.so.1"
    - "/lib/libexpat.so.1"
preflight:
  file: { type: file, path: "${binary}" }
