name: libidn
display_name: "GNU libidn"
description: "Internationalized domain names library (IDNA 2003); a change triggers a restart of dependent services"
variables:
  binary:
    - "/usr/lib64/libidn.so.12"
    - "/lib64/libidn.so.12"
    - "/usr/lib/*-linux-gnu*/libidn.so.12"
    - "/lib/*-linux-gnu*/libidn.so.12"
    - "/usr/lib/libidn.so.12"
    - "/lib/libidn.so.12"
preflight:
  file: { type: file, path: "${binary}" }
