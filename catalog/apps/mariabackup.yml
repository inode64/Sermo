name: mariadb-backup
display_name: "MariaDB Backup"
category: database
variables:
  binary:
    - ${bindir}/mariadb-backup
    - ${bindir}/mariadbbackup
preflight:
  binary: { type: binary, path: "${binary}" }
  # --no-defaults: a my.cnf option it adjusts prints a warning ahead of the version.
  version: { type: command, command: ["${binary}", "--no-defaults", "--version"], timeout: 10s }
