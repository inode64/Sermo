name: slapd
display_name: "OpenLDAP (slapd)"
category: identity
variables:
  binary:
    - /usr/sbin/slapd
    - /usr/bin/openldap/slapd
    - /usr/lib64/openldap/slapd
  slaptest:
    - /usr/sbin/slaptest
    - /usr/bin/slaptest
    - /usr/bin/openldap/slaptest
preflight:
  binary: { type: binary, path: "${binary}" }
  slaptest: { type: binary, path: "${slaptest}" }
  # slapd -VVV prints its version and exits 1 up to OpenLDAP 2.4 and 0 from 2.6.
  version: { type: command, command: ["${binary}", "-VVV"], expect_exit: [0, 1], timeout: 10s }
