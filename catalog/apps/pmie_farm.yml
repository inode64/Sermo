name: pmie_farm
display_name: "PCP Inference Engine Farm"
category: observability
version_from: pcp
variables:
  binary:
    - /usr/lib/pcp/bin/pmie_farm
    - /usr/libexec/pcp/bin/pmie_farm
    - /usr/lib64/pcp/bin/pmie_farm
  pmpause_binary:
    - /usr/libexec/pcp/bin/pmpause
    - /usr/lib/pcp/bin/pmpause
    - /usr/lib64/pcp/bin/pmpause
preflight:
  binary: { type: binary, path: "${binary}" }
  pmpause: { type: binary, path: "${pmpause_binary}", optional: true }
  # No health probe: pmie_farm is the rc wrapper of the pmie_farm service, not a
  # command. Every PCP release since it appeared (5.3.5) hands all of its
  # arguments to pmie_check — `-?` included — so a probe would run that check every
  # cycle, and its "pmie_check failed" lands in syslog. Its service is watched
  # instead (catalog/services/pmie_farm.yml).
