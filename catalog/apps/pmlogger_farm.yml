name: pmlogger_farm
display_name: "PCP Archive Logger Farm"
category: observability
version_from: pcp
variables:
  binary:
    - /usr/lib/pcp/bin/pmlogger_farm
    - /usr/libexec/pcp/bin/pmlogger_farm
    - /usr/lib64/pcp/bin/pmlogger_farm
  pmpause_binary:
    - /usr/libexec/pcp/bin/pmpause
    - /usr/lib/pcp/bin/pmpause
    - /usr/lib64/pcp/bin/pmpause
  pmsleep_binary:
    - /usr/libexec/pcp/bin/pmsleep
    - /usr/lib/pcp/bin/pmsleep
    - /usr/lib64/pcp/bin/pmsleep
preflight:
  binary: { type: binary, path: "${binary}" }
  pmpause: { type: binary, path: "${pmpause_binary}", optional: true }
  pmsleep: { type: binary, path: "${pmsleep_binary}", optional: true }
  # No health probe: pmlogger_farm is the rc wrapper of the pmlogger_farm service, not a
  # command. Every PCP release since it appeared (5.3.5) hands all of its
  # arguments to pmlogger_check — `-?` included — so a probe would run that check every
  # cycle, and its "pmlogger_check failed" lands in syslog. Its service is watched
  # instead (catalog/services/pmlogger_farm.yml).
