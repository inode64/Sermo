<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sermo{{if .Host}} · {{.Host}}{{end}} · Sign in</title>
<style nonce="{{.Nonce}}">
/*__SERMO_CSS__*/
</style>
</head>
<body>
<main>
  <h1>SERMO</h1>
  <p class="host">{{if .Host}}{{.Host}} · {{end}}Service Remediation Monitor</p>
  {{if .Note}}<p class="login-note">{{.Note}}</p>{{end}}
  {{if .Message}}<p class="error" role="alert">{{.Message}}</p>{{end}}
  <form id="login" method="post" action="login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
  </form>
  <p class="alt"><a href="login/basic">Use the browser's password dialog</a></p>
  <p class="version">{{.Version}}</p>
</main>
<script nonce="{{.Nonce}}">
  // Keep the dashboard link's #fragment (a notification's deep link to a row)
  // through the form: the browser carries it across the post-login redirect.
  if (location.hash) document.getElementById("login").action = "login" + location.hash;
</script>
</body>
</html>
