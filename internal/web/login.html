<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sermo{{if .Host}} · {{.Host}}{{end}} · Sign in</title>
<style nonce="{{.Nonce}}">
:root{color-scheme:light dark;--bg: #eef1f6;--panel: #ffffff;--panel-2: #f2f4f8;--text: #1c2430;--text-2: #5b6573;--line: #dfe4ec;--line-2: #788294;--ok: #157a32;--warn: #795000;--crit: #b4232a;--critical: #9e1c68;--info: #0860c8;--paused: #6639ba;--accent: #0860c8;--on-accent: #ffffff;--radius: 12px;--radius-s: 7px;--shadow: 0 1px 2px rgb(16 24 40 / .05), 0 1px 3px rgb(16 24 40 / .06);--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;--topbar-h: 0px}@media(prefers-color-scheme:dark){:root{--bg: #0d1117;--panel: #151b23;--panel-2: #1c232d;--text: #e6ebf2;--text-2: #8b96a5;--line: #252e39;--line-2: #647186;--ok: #3fb950;--warn: #d29922;--crit: #f85149;--critical: #f778ba;--info: #4493f8;--paused: #a371f7;--accent: #4493f8;--on-accent: #0d1117;--shadow: 0 1px 2px rgb(0 0 0 / .4)}}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}main{width:100%;max-width:22rem;padding:1.75rem 1.5rem;background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow)}h1{margin:0 0 .2rem;font-size:1.15rem;letter-spacing:.04em}.host{margin:0 0 1.25rem;color:var(--text-2);font-size:.9rem}.login-note{margin:-1rem 0 1.25rem;color:var(--text-2);font-size:.85rem;overflow-wrap:anywhere}label{display:block;margin-bottom:.35rem;font-weight:600}input[type=password]{width:100%;padding:.6rem .7rem;font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line-2);border-radius:var(--radius-s)}input[type=password]:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button{width:100%;margin-top:1rem;padding:.6rem;font:inherit;font-weight:650;cursor:pointer;color:var(--on-accent);background:var(--accent);border:0;border-radius:var(--radius-s)}.error{margin:0 0 1rem;color:var(--crit);font-weight:600}.alt{margin:1.1rem 0 0;font-size:.85rem;color:var(--text-2);text-align:center}.alt a{color:var(--accent)}.version{margin:.6rem 0 0;font-size:.75rem;color:var(--text-2);text-align:center}

</style>
</head>
<body>
<main>
  <h1>SERMO</h1>
  <p class="host">{{if .Host}}{{.Host}} · {{end}}Service Remediation Monitor</p>
  {{if .Note}}<p class="login-note">{{.Note}}</p>{{end}}
  {{if .Message}}<p class="error" role="alert">{{.Message}}</p>{{end}}
  <form id="login" method="post" action="login">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
  </form>
  <p class="alt"><a href="login/basic">Use the browser's password dialog</a></p>
  <p class="version">{{.Version}}</p>
</main>
<script nonce="{{.Nonce}}">
  // Keep the dashboard link's #fragment (a notification's deep link to a row)
  // through the form: the browser carries it across the post-login redirect.
  if (location.hash) document.getElementById("login").action = "login" + location.hash;
</script>
</body>
</html>
