# golangci-lint v2 configuration for Sermo.
#
# Its purpose is to run gosec plus a small set of focused bug analyzers that are
# not covered by the standalone tools. The other standards are covered by
# dedicated tools (gofmt, staticcheck, revive via revive.toml, govulncheck).
#
# Run with:  golangci-lint run        (requires golangci-lint v2)
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - asasalint  # []any accidentally passed to a variadic any
    - asciicheck  # non-ASCII identifiers
    - bidichk  # dangerous bidi unicode in source
    - bodyclose
    - canonicalheader  # HTTP header spelling must use net/http's canonical form
    - contextcheck  # context must flow into blocking I/O (not net/http dial — see noctx)
    - copyloopvar
    - depguard  # architecture import boundaries (see settings.depguard.rules)
    - dupword  # duplicated words (typos); off in *_test.go (protocol/script fixtures)
    - durationcheck  # suspicious time.Duration multiplications
    - dupl  # duplicate code fragments
    - errcheck  # unchecked errors (defer Rollback/Release, I/O, …)
    - errchkjson  # json.Marshal/Encode error dropped while the value can fail to encode
    - errname  # sentinel Err* and *Error type naming
    - errorlint  # error wrapping (%w) and errors.Is/As correctness
    - exhaustive  # enum switches missing cases (check/watch/backend type dispatch)
    - exptostd  # experimental APIs that now have a standard-library equivalent
    - fatcontext  # context accumulated inside loops
    - forbidigo  # ban production anti-patterns (fmt.Print*, os.Exit, time.Sleep, …)
    - forcetypeassert  # prevent panics when values with static type any are asserted
    - gocheckcompilerdirectives  # malformed //go: directives (typos that silently no-op)
    - gochecknoinits  # package initialization is forbidden outside static protocol registration
    - gochecksumtype  # exhaustive switches over documented sum types
    - gocognit  # cognitive complexity; documented exceptions preserve ordered contracts
    - goconst  # repeated production strings above the project constant threshold
    - gocyclo  # reject functions above the established cyclomatic complexity budget
    - gocritic  # focused stable bug and duplication checks (see settings)
    - godoclint  # exported APIs must retain actionable Go documentation
    - goprintffuncname  # printf-like helpers must end in f
    - gosec
    - gomoddirectives  # reject unexpected replace/exclude/retract directives
    - gomodguard_v2  # direct dependencies must be approved below
    - interfacebloat  # interfaces with too many methods (web.Backend excluded below)
    - iface  # unused / duplicated interface declarations
    - ireturn  # return-concrete; factories/registries excluded below
    - iotamixing  # reject mixed iota and explicit constant declarations
    - modernize  # Go 1.22+ idioms (range int, slices.*, min/max, …)
    - musttag  # serialized fields must carry explicit tags
    - ineffassign
    - intrange  # for i := 0; i < n; i++ → for i := range n (Go 1.22+)
    - inamedparam  # interface parameters must name their domain role
    - maintidx  # minimum maintainability index per function
    - mirror  # bytes.Index vs bytes.IndexByte, …
    - misspell
    - mnd  # require names for domain numbers (timeouts, units, protocol fields, exit codes)
    - nilerr
    - nilnil  # nil values paired with nil errors must be explicitly justified
    - nilnesserr  # err checked nil but a different err value returned
    - noctx  # blocking I/O must use *Context APIs; conn/ and *_test.go excluded
    - nosprintfhostport  # host:port construction must preserve IPv6 correctness
    - nolintlint  # //nolint: directives must name a linter and stay justified
    - perfsprint  # avoid needless fmt allocations (errors.New, strconv, concatenation)
    - prealloc  # reserve known output capacity in production hot paths
    - predeclared  # avoid shadowing Go predeclared identifiers
    - reassign  # writes to other packages' package-level vars
    - recvcheck  # mixed value/pointer receivers on one type
    - rowserrcheck  # database/sql Rows.Err() left unchecked
    - sloglint  # consistent log/slog usage
    - loggercheck  # log key/value pairs must match the logger API
    - makezero  # prevent append from discarding an already allocated slice length
    - sqlclosecheck  # SQL cursors/statements must be closed on every path
    - testableexamples  # examples must provide verifiable output
    - thelper  # t.Helper() in table-driven check callbacks and fakes
    - tparallel  # detect unsafe uses of t.Parallel
    - unconvert  # redundant conversions hide the source type and add noise
    - unparam  # unused function parameters and always-nil results
    - usestdlibvars  # prefer stdlib constants (http.StatusOK, ...)
    - unqueryvet  # prohibit SELECT * in production SQL queries
    - usetesting  # prefer testing.T cleanup-aware helpers
    - wastedassign
    - wrapcheck  # ON in core; OFF in checks/ + conn/ probe packages (see exclusions)
  settings:
    errcheck:
      # CLI and daemon operator output: a broken stdout/stderr pipe must not
      # fail the command path. Real I/O errors stay covered by other writers.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocognit:
      # Pin the current clean complexity budget instead of inheriting a tool
      # default that can change on upgrade. Lower only alongside a refactor.
      min-complexity: 30
    gocyclo:
      # See gocognit: the limit is an intentional, reviewed project budget.
      min-complexity: 30
    maintidx:
      # A lower score is harder to maintain; the current clean floor is 20.
      under: 20
    depguard:
      rules:
        # Baseline: stdlib + module imports unless a scoped deny rule matches.
        default:
          list-mode: lax
          files:
            - $all
          allow:
            - $gostd
            - sermo
        # Safety invariants: read-only layers must not import the operation engine.
        checks-no-operation:
          list-mode: lax
          files:
            - internal/checks/**
          deny:
            - pkg: sermo/internal/operation$
              desc: checks are read-only predicates; service control goes through app/operation
        conn-no-operation:
          list-mode: lax
          files:
            - internal/conn/**
          deny:
            - pkg: sermo/internal/operation$
              desc: protocol probes must not dispatch service operations
        rules-no-operation:
          list-mode: lax
          files:
            - internal/rules/**
          deny:
            - pkg: sermo/internal/operation$
              desc: rule conditions are predicates; remediation dispatches through app/worker
        config-no-operation:
          list-mode: lax
          files:
            - internal/config/**
          deny:
            - pkg: sermo/internal/operation$
              desc: config parsing/validation must not execute service control
        # Rule evaluation must stay pure; command execution belongs in checks/actions.
        rules-no-execx:
          list-mode: lax
          files:
            - internal/rules/**
            - "!**/*_test.go"
          deny:
            - pkg: sermo/internal/execx$
              desc: rule conditions must not run commands; use checks or rule actions
        # External commands must use the bounded, injectable execx runner. The
        # lock wrapper is the documented foreground-process exception.
        no-direct-os-exec:
          list-mode: lax
          files:
            - $all
            - "!$test"
            - "!**/internal/execx/**"
            - "!**/internal/cli/lock.go"
          deny:
            - pkg: os/exec$
              desc: use internal/execx; only lock wrap may execute operator argv directly
    exhaustive:
      # A default: arm is an explicit statement that the remaining cases are
      # handled; only flag switches with neither all cases nor a default.
      default-signifies-exhaustive: true
    gocritic:
      disable-all: true
      enabled-checks:
        - appendAssign
        - appendCombine
        - argOrder
        - assignOp  # n = n + 1 → n += 1 (and friends)
        - badCall
        - badCond
        - badRegexp
        - boolExprSimplify
        - caseOrder
        - defaultCaseOrder
        - dupArg
        - dupBranchBody
        - dupCase
        - dupSubExpr
        - deferInLoop
        - emptyFallthrough
        - emptyStringTest  # s == "" is clearer than len(s) == 0 for strings
        - equalFold  # strings.EqualFold over ToLower/ToUpper equality
        - evalOrder  # force evaluation order that matches the intended side effects
        - exitAfterDefer
        - flagDeref
        - httpNoBody
        - ifElseChain
        - importShadow
        - indexAlloc
        - mapKey
        - nestingReduce  # collapse needless nested if/else
        - newDeref
        - nilValReturn
        - offBy1
        - octalLiteral
        - paramTypeCombine
        - preferFilepathJoin
        - preferFprint  # prefer Fprint over WriteString(fmt.Sprint(...))
        - preferStringWriter
        - rangeAppendAll
        - regexpMust
        - regexpSimplify
        - rangeExprCopy
        - rangeValCopy  # avoid copying large values in daemon-cycle range loops
        - regexpPattern
        - sloppyLen
        - sqlQuery
        - sloppyReassign
        - sloppyTypeAssert
        - singleCaseSwitch
        - sortSlice
        - stringXbytes
        - syncMapLoadAndDelete
        - truncateCmp
        - typeAssertChain
        - typeSwitchVar
        - timeExprSimplify
        - underef
        - unlabelStmt
        - unlambda
        - unnecessaryBlock
        - unnecessaryDefer
        - unslice
        - weakCond
        - whyNoLint
        - wrapperFunc  # prefer strings.ReplaceAll, bytes.Split, …
      settings:
        rangeValCopy:
          sizeThreshold: 256
          skipTestFuncs: true
    forbidigo:
      # Production anti-patterns. Entry-point mains (cmd/, web/build) and tests
      # are excluded below; intentional control-flow panics in assist stay allowed.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: operator diagnostics use slog or internal/cli output, not fmt.Print*
        - pattern: ^log\.(Print|Fatal|Panic).*
          msg: use log/slog; the standard log package is not used in production code
        - pattern: ^os\.Exit$
          msg: only cmd entrypoints and the web bundle builder may call os.Exit
        - pattern: ^time\.Sleep$
          msg: use context deadlines or time.After/NewTimer; Sleep blocks without cancellation
        - pattern: ^http\.DefaultClient$
          msg: use an explicit http.Client with a timeout (see internal/httpx)
    dupl:
      # The default is 150 tokens, which only sees very large clones. 70 is the
      # lowest value production code is clean at: below it the reports are shape
      # matches — a struct-to-struct mapping, a spec-driven assistant Run — not
      # duplicated logic worth folding. Lower it further only alongside a fold.
      threshold: 70
    goconst:
      # AGENTS.md requires a shared constant only when a production value
      # appears more than three times. Test fixtures stay literal and readable.
      min-occurrences: 4
      ignore-tests: true
    gomoddirectives:
      # Sermo is an application: module and toolchain changes are deliberate
      # supply-chain changes and must not appear as incidental go.mod edits.
      exclude-forbidden: true
      go-debug-forbidden: true
      go-version-pattern: '^1\.26\.5$'
      ignore-forbidden: true
      tool-forbidden: true
      toolchain-forbidden: true
    gomodguard_v2:
      # The allowlist covers the direct production dependencies in go.mod. A
      # new direct dependency therefore gets an explicit quality-policy review.
      local-replace-directives: true
      allowed:
        - module: github.com/beevik/ntp
        - module: github.com/cloudsoda/go-smb2
        - module: github.com/digitalocean/go-libvirt
        - module: github.com/evanw/esbuild
        - module: github.com/go-ldap/ldap/v3
        - module: github.com/go-sql-driver/mysql
        - module: github.com/goccy/go-yaml
        - module: github.com/godbus/dbus/v5
        - module: github.com/google/nftables
        - module: github.com/gosnmp/gosnmp
        - module: github.com/lib/pq
        - module: github.com/quic-go/quic-go
        - module: github.com/spf13/pflag
        - module: github.com/vishvananda/netlink
        - module: github.com/wneessen/go-mail
        - module: go.mongodb.org/mongo-driver/v2
        - module: golang.org/x/crypto
        - module: golang.org/x/net
        - module: golang.org/x/sys
        - module: modernc.org/sqlite
    loggercheck:
      # Every log entry remains machine-queryable and avoids printf semantics.
      no-printf-like: true
      require-string-key: true
      slog: true
    misspell:
      # Eclipse Mosquitto — real MQTT broker name in catalog/tests.
      ignore-rules:
        - mosquitto
    nolintlint:
      # A suppression is part of the code's safety contract: name the checker,
      # explain the exception, and fail if it stops being necessary.
      allow-unused: false
      require-explanation: true
      require-specific: true
    unparam:
      # No package in this application is a supported external API.
      check-exported: true
  # Considered and deliberately NOT enabled:
  #   containedctx — daemon-lifetime contexts are intentionally held by monitor,
  #                  loader, state and web server owners.
  #   embeddedstructfieldcheck — 69 field-ordering/whitespace findings; the
  #                  existing compact embedded check types are intentionally uniform.
  #   err113 — operator-facing configuration errors need their concrete context,
  #             not a sentinel type for every message.
  #   gochecknoglobals — registries, host detection and test injection are owned
  #                  package state, not mutable ambient application state.
  exclusions:
    generated: strict
    warn-unused: true

    paths:
      - '(^|/)node_modules/'

    # Sermo es una aplicación, no una librería pública. No exigiría
    # documentación para cada símbolo exportado de paquetes internal.
    presets:
      - comments

    rules:
      # Test fixtures and table data need literal values and intentionally
      # incomplete fakes, but test-specific linters (thelper, tparallel,
      # testableexamples and usetesting) must still inspect every *_test.go.
      - path: '_test\.go$'
        linters:
          - asasalint
          - asciicheck
          - bidichk
          - bodyclose
          - canonicalheader
          - contextcheck
          - copyloopvar
          - depguard
          - dupword
          - durationcheck
          - dupl
          - errcheck
          - errchkjson
          - errname
          - errorlint
          - exhaustive
          - exptostd
          - fatcontext
          - forbidigo
          - forcetypeassert
          - gocheckcompilerdirectives
          - gochecknoinits
          - gochecksumtype
          - gocognit
          - goconst
          - gocyclo
          - gocritic
          - godoclint
          - goprintffuncname
          - gosec
          - gomoddirectives
          - gomodguard_v2
          - interfacebloat
          - iface
          - ireturn
          - iotamixing
          - modernize
          - musttag
          - ineffassign
          - intrange
          - inamedparam
          - maintidx
          - mirror
          - misspell
          - mnd
          - nilerr
          - nilnil
          - nilnesserr
          - noctx
          - nosprintfhostport
          - perfsprint
          - prealloc
          - predeclared
          - reassign
          - recvcheck
          - rowserrcheck
          - sloglint
          - loggercheck
          - makezero
          - sqlclosecheck
          - unconvert
          - unparam
          - usestdlibvars
          - unqueryvet
          - wastedassign
          - wrapcheck

      # These native protocol encoders deliberately select fixed-width wire
      # fields. Their request builders have protocol-level regression tests;
      # keep G115 active everywhere else, including the remaining conn probes.
      - path: '^internal/conn/(fpm|ipp|kafka|mqtt|nfs|openvpn|rdp|smb|snmp)\.go$'
        linters:
          - gosec
        text: G115

      # Los protocolos se registran intencionadamente durante init.
      - linters:
          - gochecknoinits
        path: '^internal/conn/'

      # Entry points may call os.Exit / print --version / inject default sleep.
      # Production packages under internal/ stay subject to forbidigo.
      - linters:
          - forbidigo
        path: '^cmd/'
      - linters:
          - forbidigo
        path: '^internal/web/build/'

      # Store binds ctx at OpenContext; *Context SQL uses Store.sqlCtx(). The
      # linter does not trace that embedded store context through method
      # receivers, so CLI/state paths that correctly use the store look wrong.
      - linters:
          - contextcheck
        path: '^internal/state/'
      - linters:
          - contextcheck
        path: '^internal/cli/(monitor|panic|sla|state|watch|cli_monitor_state)\.go$'

      # wrapcheck zone policy (same idea as ireturn):
      #   ON  — operation, rules, config, state, app, cli, process, web, locks,
      #         managers, notify, assist, cmd, and probes whose errors already
      #         carry context.
      #   OFF — check and conn sources that deliberately turn transport I/O
      #         into Result/check messages. Expand those with contextual %w.
      - linters:
          - wrapcheck
        path: '^internal/checks/(commandcheck|conntrack|count|diskio|edac|fds|firewall_nftables|firewall_nftables_other|icmp|influxdb|meminfo|mongodb|mount|net|pids|pressure|raid|route|route_family_other|sensors|size|sql|storage|tcpcheck|users|websocket)\.go$'
      # conn sources that still need contextual wrapping before the rule can run.
      - linters:
          - wrapcheck
        path: '^internal/conn/(ajp|amqp|avahi|bind|bind_linux|bind_other|ceph|chrony|conn|dbus|deadline|dhclient|dhcp|dhcp_linux|dhcp_other|dial|dns|docker|fpm|ftp|guacd|http_client|imap|ipp|kafka|ldap|libvirt|lvmpolld|memcached|mongodb|mqtt|mysql|nfs|nntp|ntp|nut|openvpn|openvswitch|pop|prometheus|rdp|redis|smb|smtp|snmp|ssh|syncthing|tftp|udisks2)\.go$'

      # ireturn zone policy:
      #   ON  — every package except central builders, manager factories and
      #         injectable seams: accidental interface returns fail the gate.
      #   OFF — central builders and seams that must return interfaces
      #         (AGENTS: Backend holder and managers). Other intentional
      #         interface boundaries carry a local, explained suppression.
      - linters:
          - ireturn
        path: '^internal/checks/'
      - linters:
          - ireturn
        path: '^internal/notify/'
      - linters:
          - ireturn
        path: '^internal/app/(hook|watch_build|procwatch|serviceruntime|webholder)\.go$'
      - linters:
          - ireturn
        path: '^internal/assist/assist\.go$'
      - linters:
          - ireturn
        path: '^internal/(servicemgr/manager|dockerctl/manager|virt/manager|mountctl/mountctl|locks/(named|scanner)|process/discover)\.go$'


issues:
  # Report every finding (golangci-lint otherwise caps repeated issues at 3).
  max-issues-per-linter: 0
  max-same-issues: 0
