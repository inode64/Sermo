# golangci-lint v2 configuration for Sermo.
#
# This file is the single source of truth for every analyzer except gofmt,
# staticcheck, govulncheck and deadcode, which stay standalone in `make lint`.
# revive and NilAway both run from here — there is no revive.toml.
#
# Run with:  make lint
# NilAway is a module plugin, so it needs bin/custom-gcl (see .custom-gcl.yml);
# a plain `golangci-lint run` fails with `plugin "nilaway" not found`.
version: "2"

run:
  tests: true

linters:
  default: none
  enable:
    - asasalint  # []any accidentally passed to a variadic any
    - asciicheck  # non-ASCII identifiers
    - bidichk  # dangerous bidi unicode in source
    - bodyclose
    - canonicalheader  # HTTP header spelling must use net/http's canonical form
    - contextcheck  # context must flow into blocking I/O (not net/http dial — see noctx)
    - copyloopvar
    - depguard  # architecture import boundaries (see settings.depguard.rules)
    - dupword  # duplicated words (typos); off in *_test.go (protocol/script fixtures)
    - durationcheck  # suspicious time.Duration multiplications
    - dogsled  # too many blank identifiers in one assignment
    - dupl  # duplicate code fragments
    - errcheck  # unchecked errors (defer Rollback/Release, I/O, …)
    - errchkjson  # json.Marshal/Encode error dropped while the value can fail to encode
    - errname  # sentinel Err* and *Error type naming
    - errorlint  # error wrapping (%w) and errors.Is/As correctness
    - exhaustive  # enum switches missing cases (check/watch/backend type dispatch)
    - exptostd  # experimental APIs that now have a standard-library equivalent
    - fatcontext  # context accumulated inside loops
    - forbidigo  # ban production anti-patterns (fmt.Print*, os.Exit, time.Sleep, …)
    - forcetypeassert  # prevent panics when values with static type any are asserted
    - gocheckcompilerdirectives  # malformed //go: directives (typos that silently no-op)
    - gochecknoinits  # package initialization is forbidden outside static protocol registration
    - gochecksumtype  # exhaustive switches over documented sum types
    - gocognit  # cognitive complexity; documented exceptions preserve ordered contracts
    - goconst  # repeated production strings above the project constant threshold
    - gocyclo  # reject functions above the established cyclomatic complexity budget
    - gocritic  # focused stable bug and duplication checks (see settings)
    - godoclint  # exported APIs must retain actionable Go documentation
    - godot  # declaration comments end in a period (already true tree-wide)
    - godox  # no TODO/FIXME/BUG left in code; pending work belongs in TODO.md
    - goprintffuncname  # printf-like helpers must end in f
    - gosec
    - govet  # see settings.govet: enable-all minus fieldalignment/shadow
    - gomoddirectives  # reject unexpected replace/exclude/retract directives
    - gomodguard_v2  # direct dependencies must be approved below
    - interfacebloat  # interfaces with too many methods (web.Backend excluded below)
    - iface  # unused / duplicated interface declarations
    - ireturn  # return-concrete; factories/registries excluded below
    - iotamixing  # reject mixed iota and explicit constant declarations
    - modernize  # Go 1.22+ idioms (range int, slices.*, min/max, …)
    - musttag  # serialized fields must carry explicit tags
    - ineffassign
    - intrange  # for i := 0; i < n; i++ → for i := range n (Go 1.22+)
    - inamedparam  # interface parameters must name their domain role
    - maintidx  # minimum maintainability index per function
    - mirror  # bytes.Index vs bytes.IndexByte, …
    - misspell
    - mnd  # require names for domain numbers (timeouts, units, protocol fields, exit codes)
    - nakedret  # naked returns hide which value is returned in long functions
    - nilaway  # module plugin: nil-flow analysis over production code (see settings.custom)
    - nilerr
    - nilnil  # nil values paired with nil errors must be explicitly justified
    - nilnesserr  # err checked nil but a different err value returned
    - noctx  # blocking I/O must use *Context APIs; conn/ and *_test.go excluded
    - nosprintfhostport  # host:port construction must preserve IPv6 correctness
    - nolintlint  # //nolint: directives must name a linter and stay justified
    - perfsprint  # avoid needless fmt allocations (errors.New, strconv, concatenation)
    - prealloc  # reserve known output capacity in production hot paths
    - predeclared  # avoid shadowing Go predeclared identifiers
    - reassign  # writes to other packages' package-level vars
    - recvcheck  # mixed value/pointer receivers on one type
    - revive  # style and defect rules (see settings.revive.rules)
    - rowserrcheck  # database/sql Rows.Err() left unchecked
    - sloglint  # consistent log/slog usage
    - loggercheck  # log key/value pairs must match the logger API
    - makezero  # prevent append from discarding an already allocated slice length
    - sqlclosecheck  # SQL cursors/statements must be closed on every path
    - testableexamples  # examples must provide verifiable output
    - thelper  # t.Helper() in table-driven check callbacks and fakes
    - tparallel  # detect unsafe uses of t.Parallel
    - unconvert  # redundant conversions hide the source type and add noise
    - unparam  # unused function parameters and always-nil results
    - usestdlibvars  # prefer stdlib constants (http.StatusOK, ...)
    - unqueryvet  # prohibit SELECT * in production SQL queries
    - usetesting  # prefer testing.T cleanup-aware helpers
    - wastedassign
    - whitespace  # leading/trailing blank lines inside a block
    - wrapcheck  # ON in core; OFF in checks/ + conn/ probe packages (see exclusions)
  settings:
    custom:
      # NilAway runs as a module plugin because golangci-lint does not ship it
      # (golangci/golangci-lint#4045). It therefore needs the custom binary built
      # from .custom-gcl.yml — plain `golangci-lint run` silently lacks this
      # linter, which is why `make lint` invokes bin/custom-gcl.
      nilaway:
        type: module
        description: Detects potential nil panics by inferring nil flow across packages.
        # Values must be strings: the plugin forwards them as NilAway CLI flags.
        settings:
          # Production only. Test files carry 57 findings (fakes with nil fields,
          # fixtures indexed without guards) that say nothing about shipped code.
          # This is NilAway's own flag, so test files are never analysed at all —
          # do not replace it with a `_test\.go$` entry under exclusions.
          exclude-test-files: "true"
          # Report only on this module. NilAway still infers through stdlib and
          # dependencies, but their findings are not ours to fix.
          include-pkgs: "sermo"
    errcheck:
      # CLI and daemon operator output: a broken stdout/stderr pipe must not
      # fail the command path. Real I/O errors stay covered by other writers.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
      # Off by default. An unchecked `x := v.(T)` panics on the wrong type;
      # forcetypeassert already gates this, so keeping both costs nothing and
      # survives either linter being dropped. check-blank stays off: it reports
      # 203 deliberate `_ =` discards.
      check-type-assertions: true
    gocognit:
      # Pin the current clean complexity budget instead of inheriting a tool
      # default that can change on upgrade. Lower only alongside a refactor.
      min-complexity: 30
    gocyclo:
      # See gocognit: the limit is an intentional, reviewed project budget.
      min-complexity: 30
    maintidx:
      # A lower score is harder to maintain; the current clean floor is 20.
      under: 20
    depguard:
      rules:
        # Baseline: stdlib + module imports unless a scoped deny rule matches.
        default:
          list-mode: lax
          files:
            - $all
          allow:
            - $gostd
            - sermo
        # Safety invariants: read-only layers must not import the operation engine.
        checks-no-operation:
          list-mode: lax
          files:
            - internal/checks/**
          deny:
            - pkg: sermo/internal/operation$
              desc: checks are read-only predicates; service control goes through app/operation
        conn-no-operation:
          list-mode: lax
          files:
            - internal/conn/**
          deny:
            - pkg: sermo/internal/operation$
              desc: protocol probes must not dispatch service operations
        rules-no-operation:
          list-mode: lax
          files:
            - internal/rules/**
          deny:
            - pkg: sermo/internal/operation$
              desc: rule conditions are predicates; remediation dispatches through app/worker
        config-no-operation:
          list-mode: lax
          files:
            - internal/config/**
          deny:
            - pkg: sermo/internal/operation$
              desc: config parsing/validation must not execute service control
        # Rule evaluation must stay pure; command execution belongs in checks/actions.
        rules-no-execx:
          list-mode: lax
          files:
            - internal/rules/**
            - "!**/*_test.go"
          deny:
            - pkg: sermo/internal/execx$
              desc: rule conditions must not run commands; use checks or rule actions
        # External commands must use the bounded, injectable execx runner. The
        # lock wrapper is the documented foreground-process exception.
        no-direct-os-exec:
          list-mode: lax
          files:
            - $all
            - "!$test"
            - "!**/internal/execx/**"
            - "!**/internal/cli/lock.go"
          deny:
            - pkg: os/exec$
              desc: use internal/execx; only lock wrap may execute operator argv directly
    govet:
      # Every analyzer `go vet` does not run by default — nilness, unusedwrite,
      # sortslice, waitgroup, atomicalign, deepequalerrors, reflectvaluecompare,
      # httpmux, hostport — is clean here, so they are gated to keep it that way.
      # NOTE: this block was dead until govet was added to linters.enable above.
      # With `default: none` a settings block alone runs nothing, so these
      # analyzers had never actually gated anything; turning them on found a real
      # unusedwrite in cli.go. Keep govet in the enable list, not just here.
      # fieldalignment is a struct-layout debate (measured 267 findings on
      # production files, all cosmetic ordering); shadow flags the idiomatic
      # `if err := f(); err != nil` redeclaration 38 times in production alone.
      # Both stay off deliberately. Re-measure before quoting these numbers.
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    exhaustive:
      # A default: arm is an explicit statement that the remaining cases are
      # handled; only flag switches with neither all cases nor a default.
      default-signifies-exhaustive: true
    gocritic:
      # Everything gocritic ships, minus the two checks that fight this
      # codebase's value semantics: hugeParam/unnamedResult would push pointer
      # parameters and named results onto types that are deliberately copied.
      # Measured: enable-all costs 0 findings beyond those two.
      enable-all: true
      disabled-checks:
        - hugeParam
        - unnamedResult
      settings:
        rangeValCopy:
          sizeThreshold: 256
          skipTestFuncs: true
    forbidigo:
      # Production anti-patterns. Entry-point mains (cmd/, web/build) and tests
      # are excluded below; intentional control-flow panics in assist stay allowed.
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: operator diagnostics use slog or internal/cli output, not fmt.Print*
        - pattern: ^log\.(Print|Fatal|Panic).*
          msg: use log/slog; the standard log package is not used in production code
        - pattern: ^os\.Exit$
          msg: only cmd entrypoints and the web bundle builder may call os.Exit
        - pattern: ^time\.Sleep$
          msg: use context deadlines or time.After/NewTimer; Sleep blocks without cancellation
        - pattern: ^http\.DefaultClient$
          msg: use an explicit http.Client with a timeout (see internal/httpx)
    dupl:
      # The default is 150 tokens, which only sees very large clones. 60 is the
      # lowest value production code is clean at, and only with the three
      # //nolint:dupl sites this repo carries; 65 is clean with none. Measured
      # floors below that: 55 -> 18 reports, 50 -> 30, all of them shape matches
      # rather than duplicated logic — unrelated const blocks sharing only a run
      # of `name = literal`, struct-to-struct mappings whose field lists have
      # nothing in common, interface-forwarding delegates, and the per-type rows
      # of the central check builders, each already a single call naming one
      # check's constants. Folding those hides what each surface exposes; it
      # removes no logic. Lower this only alongside a fold that moves the
      # measured floor, never by adding exclusions.
      threshold: 60
    goconst:
      # AGENTS.md requires a shared constant only when a production value
      # appears more than three times. Test fixtures stay literal and readable.
      min-occurrences: 4
      ignore-tests: true
    gomoddirectives:
      # Sermo is an application: module and toolchain changes are deliberate
      # supply-chain changes and must not appear as incidental go.mod edits.
      exclude-forbidden: true
      go-debug-forbidden: true
      go-version-pattern: '^1\.26\.5$'
      ignore-forbidden: true
      tool-forbidden: true
      toolchain-forbidden: true
    gomodguard_v2:
      # The allowlist covers the direct production dependencies in go.mod. A
      # new direct dependency therefore gets an explicit quality-policy review.
      local-replace-directives: true
      allowed:
        - module: github.com/beevik/ntp
        - module: github.com/cloudsoda/go-smb2
        - module: github.com/digitalocean/go-libvirt
        - module: github.com/evanw/esbuild
        - module: github.com/go-ldap/ldap/v3
        - module: github.com/go-sql-driver/mysql
        - module: github.com/goccy/go-yaml
        - module: github.com/godbus/dbus/v5
        - module: github.com/google/nftables
        - module: github.com/gosnmp/gosnmp
        - module: github.com/lib/pq
        - module: github.com/quic-go/quic-go
        - module: github.com/spf13/pflag
        - module: github.com/vishvananda/netlink
        - module: github.com/wneessen/go-mail
        - module: go.mongodb.org/mongo-driver/v2
        - module: golang.org/x/crypto
        - module: golang.org/x/net
        - module: golang.org/x/sys
        - module: modernc.org/sqlite
    loggercheck:
      # Every log entry remains machine-queryable and avoids printf semantics.
      no-printf-like: true
      require-string-key: true
      slog: true
    misspell:
      # Eclipse Mosquitto — real MQTT broker name in catalog/tests.
      ignore-rules:
        - mosquitto
    perfsprint:
      # Off by default: fmt.Sprintf("%v", err) allocates for what err.Error()
      # already returns. Every other perfsprint check is on by default.
      err-error: true
    revive:
      # Was a standalone `revive -config revive.toml` step that ran WITHOUT
      # -set_exit_status, so it printed findings and never failed anything.
      # Running it here fixes the gate and keeps one config: test files are
      # scoped out by the `_test\.go$` exclusion rule like every other linter.
      # golangci-lint rejects an unknown rule name (exit 7), so a typo here
      # cannot silently switch a rule off.
      rules:
        # revive's default set.
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: var-naming
        # revive v1.15 moved the package-name checks out of var-naming into this
        # rule; without it that coverage silently disappears.
        - name: package-naming
        - name: unused-parameter
        # Same idea as unused-parameter for methods: an unused receiver is either
        # dead surface or should omit the name (func (*T) M, not func (_ *T) M —
        # staticcheck ST1006 rejects the underscore form). Stubs like Reload
        # unsupported and pure Error() messages are the usual hits.
        - name: unused-receiver
        # Prefer errors.New over fmt.Errorf when there is no formatting verb;
        # keeps error allocation cheap and the message static for aggregation.
        - name: use-errors-new
        # Functions named Get* are expected to return a value; flag pure side
        # effect "getters" that yield nothing.
        - name: get-return
        - name: struct-tag
        - name: import-shadowing
        - name: modifies-value-receiver
        # Concurrency footguns.
        - name: atomic
        - name: waitgroup-by-value
        - name: datarace
        # Capturing a range variable by pointer/address in a goroutine or
        # deferred closure is still wrong even with Go 1.22 per-iteration loop
        # vars, when the address escapes across iterations.
        - name: range-val-address
        - name: range-val-in-closure
        # Control-flow and comparison defects.
        - name: unconditional-recursion
        - name: identical-branches
        - name: constant-logical-expr
        - name: bool-literal-in-expr
        - name: time-equal
        - name: string-of-int
        # Every defer sub-check except `recover`: assist.Recover is invoked as
        # `defer assist.Recover(&err)`, so recover() *is* inside the deferred
        # function, but the rule only sees the helper body and reports it. The
        # rest (defer in a loop, return inside defer, deferring a method value)
        # are real footguns and stay on.
        - name: defer
          arguments:
            - - loop
              - call-chain
              - method-call
              - return
              - immediate-recover
        # Redundancy and dead syntax.
        - name: duplicated-imports
        - name: redundant-import-alias
        - name: useless-break
        - name: unnecessary-stmt
        - name: unnecessary-format
        - name: optimize-operands-order
        - name: early-return
        - name: use-any
        - name: comment-spacings
    prealloc:
      # Off by default; simple and range-loops are already on. Classic
      # index-loop appends get the same capacity hint as range appends.
      for-loops: true
    sloglint:
      # Both off by default and both already satisfied tree-wide. A formatted
      # message defeats log aggregation, and mixed key casing defeats querying.
      static-msg: true
      key-naming-case: snake
    usestdlibvars:
      # All off by default. tls-signature-scheme stays off: its only hit is
      # `keyAlgorithmEd25519 = "Ed25519"` in a const block, and the suggested
      # tls.Ed25519.String() is a method call, so it cannot be a constant.
      time-weekday: true
      time-month: true
      time-layout: true
      crypto-hash: true
      default-rpc-path: true
      sql-isolation-level: true
      constant-kind: true
    nolintlint:
      # A suppression is part of the code's safety contract: name the checker,
      # explain the exception, and fail if it stops being necessary.
      allow-unused: false
      require-explanation: true
      require-specific: true
    unparam:
      # No package in this application is a supported external API.
      check-exported: true
  # Considered and deliberately NOT enabled. Counts are measured on production
  # files only (run.tests: false); re-measure before reopening any of these.
  #   containedctx (5) — daemon-lifetime contexts are intentionally held by
  #                  monitor, loader, state and web server owners.
  #   embeddedstructfieldcheck (64) — field-ordering/whitespace findings; the
  #                  existing compact embedded check types are intentionally uniform.
  #   err113 (469) — operator-facing configuration errors need their concrete
  #                  context, not a sentinel type for every message.
  #   gochecknoglobals (122) — registries, host detection and test injection are
  #                  owned package state, not mutable ambient application state.
  #   cyclop (202) — a second cyclomatic metric on top of gocyclo/gocognit,
  #                  which already carry reviewed budgets.
  #   funlen (9) / nestif (27) — length and nesting are already bounded by
  #                  gocognit, gocyclo and maintidx; these would add a third axis.
  #   funcorder (76) / nonamedreturns (76) — the codebase orders methods by
  #                  topic and uses named returns deliberately in defer paths.
  #   noinlineerr (496) — bans the idiomatic `if err := f(); err != nil`.
  #   lll (547) / nlreturn (2911) / wsl_v5 (5508) / varnamelen (822) /
  #   exhaustruct (920) — whitespace, line-length and total-initialisation
  #                  churn with no defect-finding value here.
  #   decorder, grouper, gosmopolitan — measured at 0, but their default
  #                  configurations assert almost nothing; enabling them would
  #                  document intent the code does not actually depend on.
  exclusions:
    generated: strict
    warn-unused: true

    # `go list ./...` reaches a vendored Go sample under node_modules. GO_PACKAGES
    # never includes it, so this suppresses nothing in `make lint` and warn-unused
    # says so; it stays as the guard for anyone running the config over ./...
    paths:
      - '(^|/)node_modules/'

    # The `comments` preset used to be listed here, on the argument that an
    # application need not document every exported symbol of an internal package.
    # Removing it changes nothing — measured at 0 findings — because the tree
    # already documents them, and godoclint plus revive's `exported` and
    # `package-comments` rules were the very checks it was cancelling. Keeping it
    # would silently contradict AGENTS.md, which states `exported` is on.
    rules:
      # Test fixtures and table data need literal values and intentionally
      # incomplete fakes, but test-specific linters (thelper, tparallel,
      # testableexamples and usetesting) must still inspect every *_test.go.
      - path: '_test\.go$'
        linters:
          - asasalint
          - asciicheck
          - bidichk
          - bodyclose
          - canonicalheader
          - contextcheck
          - copyloopvar
          - depguard
          - dogsled
          - dupword
          - durationcheck
          - dupl
          - errcheck
          - errchkjson
          - errname
          - errorlint
          - exhaustive
          - exptostd
          - fatcontext
          - forbidigo
          - forcetypeassert
          - gocheckcompilerdirectives
          - gochecknoinits
          - gochecksumtype
          - gocognit
          - goconst
          - gocyclo
          - gocritic
          - godoclint
          - godot
          - godox
          - goprintffuncname
          - gosec
          - govet
          - gomoddirectives
          - gomodguard_v2
          - interfacebloat
          - iface
          - ireturn
          - iotamixing
          - modernize
          - musttag
          - ineffassign
          - intrange
          - inamedparam
          - maintidx
          - mirror
          - misspell
          - mnd
          - nakedret
          - nilerr
          - nilnil
          - nilnesserr
          - noctx
          - nosprintfhostport
          - perfsprint
          - prealloc
          - predeclared
          - reassign
          - recvcheck
          - revive
          - rowserrcheck
          - sloglint
          - loggercheck
          - makezero
          - sqlclosecheck
          - unconvert
          - unparam
          - usestdlibvars
          - unqueryvet
          - wastedassign
          - whitespace
          - wrapcheck

      # G115 used to be excluded for nine whole protocol encoders here, which also
      # exempted any conversion added to them later. The 21 deliberate wire-format
      # truncations now carry their own //nolint:gosec at the call site, naming the
      # field width that makes each one the encoding rather than a loss — so a new
      # unchecked conversion in those files is caught again, and nolintlint fails
      # the build if one of the suppressions stops being necessary.

      # Los protocolos se registran intencionadamente durante init.
      - linters:
          - gochecknoinits
        path: '^internal/conn/'


      # Store binds ctx at OpenContext; *Context SQL uses Store.sqlCtx(). The
      # linter does not trace that embedded store context through method
      # receivers, so CLI/state paths that correctly use the store look wrong.
      - linters:
          - contextcheck
        path: '^internal/cli/(monitor|panic|sla|cli_monitor_state)\.go$'

      # wrapcheck zone policy (same idea as ireturn):
      #   ON  — operation, rules, config, state, app, cli, process, web, locks,
      #         managers, notify, assist, cmd, and probes whose errors already
      #         carry context.
      #   OFF — check and conn sources that deliberately turn transport I/O
      #         into Result/check messages. Expand those with contextual %w.
      - linters:
          - wrapcheck
        path: '^internal/checks/(commandcheck|conntrack|diskio|edac|fds|firewall_nftables|firewall_nftables_other|icmp|influxdb|meminfo|mongodb|mount|net|pids|pressure|raid|route|route_family_other|sensors|sql|storage|tcpcheck|users|websocket)\.go$'

      # ireturn zone policy:
      #   ON  — every package except central builders, manager factories and
      #         injectable seams: accidental interface returns fail the gate.
      #   OFF — central builders and seams that must return interfaces
      #         (AGENTS: Backend holder and managers). Other intentional
      #         interface boundaries carry a local, explained suppression.
      - linters:
          - ireturn
        path: '^internal/checks/'
      - linters:
          - ireturn
        path: '^internal/notify/'
      - linters:
          - ireturn
        path: '^internal/app/(hook|watch_build|procwatch|serviceruntime|webholder)\.go$'
      - linters:
          - ireturn
        path: '^internal/assist/assist\.go$'
      - linters:
          - ireturn
        path: '^internal/(servicemgr/manager|dockerctl/manager|virt/manager|mountctl/mountctl|locks/(named|scanner)|process/discover)\.go$'


issues:
  # Report every finding (golangci-lint otherwise caps repeated issues at 3).
  max-issues-per-linter: 0
  max-same-issues: 0
