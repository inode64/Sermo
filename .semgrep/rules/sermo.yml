# Repository invariants that no generic Go linter can express.
#
# depguard already enforces the *import* boundaries in .golangci.yml. These are
# the call-level contracts that survive an allowed import, each one written
# because the contract exists only as a comment today and was violated at least
# once.
rules:
  - id: web-request-must-not-discover-processes
    languages: [go]
    severity: ERROR
    message: >-
      The service indicator path must not discover processes. Daemon cycles own
      the runtime evidence and its freshness boundary; read the worker-published
      snapshot instead. The dashboard polls every service, so a scan here forks
      once per configured service per refresh.
    paths:
      include:
        - internal/app/webbackend_services.go
    patterns:
      # Scoped to the two functions that carry the contract, not the whole file:
      # Detail() deliberately discovers, because it renders one service the user
      # opened rather than every row of the dashboard.
      - pattern-either:
          - pattern-inside: func ($B *WebBackend) serviceWarningReason(...) $R { ... }
          - pattern-inside: func ($B *WebBackend) serviceProcessActive(...) $R { ... }
      - pattern-either:
          - pattern: process.PIDsByComm(...)
          - pattern: process.NewDiscovererWithUserLookup(...)
          - pattern: $D.Discover(...)

  - id: uncomparable-servicemgr-manager
    languages: [go]
    severity: ERROR
    message: >-
      servicemgr.Manager is uncomparable: openrcManager carries a readFile func
      field, so == on two managers panics at runtime. Compare the concrete type
      with a type switch. Comparing against nil is safe and allowed.
    patterns:
      - pattern-either:
          - pattern: $X == $Y
          - pattern: $X != $Y
      - metavariable-type:
          metavariable: $X
          type: servicemgr.Manager
      - metavariable-type:
          metavariable: $Y
          type: servicemgr.Manager

  - id: shared-process-snapshot-must-not-be-mutated
    languages: [go]
    severity: ERROR
    message: >-
      CachingReader.Snapshot returns the cached identity map itself, shared by
      every concurrent reader. Writing to it corrupts other callers' view and
      races with the refresh that rebuilds it. Copy first (maps.Clone) if you
      need to change entries.
    patterns:
      - pattern-either:
          - pattern: |
              $M := $R.Snapshot()
              ...
              $M[$K] = $V
          - pattern: |
              $M := $R.Snapshot()
              ...
              delete($M, $K)
          - pattern: |
              $M := $R.Snapshot()
              ...
              clear($M)
      - metavariable-type:
          metavariable: $R
          type: "*process.CachingReader"

  - id: redactor-must-not-mutate-its-argument
    languages: [go]
    severity: ERROR
    message: >-
      A cmdline redactor must not write through its own slice argument. Command
      lines carry tokens and passwords, and the redacted copy is what read-only
      viewers get; mutating in place rewrites the backend's own data, so the
      privileged view silently loses the arguments too. Build on redactCloned,
      which clones first.
    patterns:
      # Metavariables bind whole tokens, so the redact prefix is a regex on the
      # function name rather than part of the pattern's identifier. The rule
      # names the defect (writing through the argument) instead of the absence
      # of the helper: pattern-not on the enclosing function eliminated both the
      # good and the bad shape.
      - pattern-inside: |
          func $F($ITEMS []$T) []$T { ... }
      - metavariable-regex:
          metavariable: $F
          regex: ^redact
      - pattern-either:
          - pattern: $ITEMS[$I].$FIELD = $V
          - pattern: $ITEMS[$I] = $V

  - id: service-lifecycle-must-use-operation
    languages: [go]
    severity: ERROR
    message: >-
      Service start/stop/restart/reload/reset-state must go through
      internal/operation. Primitive backends (servicemgr, dockerctl, virt)
      implement Manager; CLI, daemon and web must not call those methods
      directly.
    paths:
      exclude:
        - internal/operation/**
        - internal/servicemgr/**
        - internal/dockerctl/**
        - internal/virt/**
        - '**/*_test.go'
    patterns:
      - pattern-either:
          - pattern: $M.Start($CTX, $SVC)
          - pattern: $M.Stop($CTX, $SVC)
          - pattern: $M.Restart($CTX, $SVC)
          - pattern: $M.Reload($CTX, $SVC)
          - pattern: $M.ResetState($CTX, $SVC)
      - metavariable-type:
          metavariable: $M
          type: servicemgr.Manager

  - id: syscall-kill-must-use-process-signaler
    languages: [go]
    severity: ERROR
    message: >-
      kill(2) with a real signal must go through process.Signaler so identity
      and PID-reuse guards stay in one place. Signal 0 is a liveness probe and
      is allowed. process and execx are the primitive owners (execx kills its
      own process group on timeout).
    paths:
      exclude:
        - internal/process/**
        - internal/execx/**
        - '**/*_test.go'
    patterns:
      - pattern: syscall.Kill($PID, $SIG)
      - pattern-not: syscall.Kill($PID, 0)

  - id: yaml-duration-must-use-cfgval
    languages: [go]
    severity: ERROR
    message: >-
      YAML and config durations parse through cfgval.ParseDuration so invalid
      vs zero cannot drift. Named exceptions: state.ParseCutoff (operator
      cutoff), the web query parser, and checks/summary display of already
      formatted values.
    paths:
      exclude:
        - internal/cfgval/**
        - internal/state/cutoff.go
        - internal/web/handlers_events.go
        - internal/web/handlers_series.go
        - internal/checks/summary.go
        - '**/*_test.go'
    patterns:
      - pattern: time.ParseDuration(...)

  - id: daemon-http-contract-literals
    languages: [go]
    severity: ERROR
    message: >-
      Daemon HTTP header names live in internal/web/api_contract.go. A second
      literal can silently desync sermoctl from sermod. Reference web.HeaderCSRF,
      web.HeaderGeneration or web.HeaderConfirm.
    paths:
      exclude:
        - internal/web/api_contract.go
        - '**/*_test.go'
    patterns:
      - pattern-either:
          - pattern: '"X-Sermo-Csrf"'
          - pattern: '"X-Sermo-Generation"'
          - pattern: '"X-Sermo-Confirm"'

  - id: strutil-must-not-merge-unique-of-unique
    languages: [go]
    severity: ERROR
    message: >-
      Unique is already MergeUnique(nil, values...). Nesting Unique inside
      MergeUnique double-walks the same strings. Deduplicate the combined
      inputs once: Unique(append(list, extra...)).
    paths:
      exclude:
        - internal/strutil/strutil.go
        - '**/*_test.go'
    patterns:
      - pattern-either:
          - pattern: strutil.MergeUnique(strutil.Unique(...), ...)
          - pattern: MergeUnique(Unique(...), ...)

  - id: strutil-must-not-merge-composite-list
    languages: [go]
    severity: ERROR
    message: >-
      MergeUnique keeps empty strings already in its list argument; only the
      variadic extras are skipped. A composite []string{...} seed therefore
      preserves blanks. Build the full set and call Unique once.
    paths:
      exclude:
        - internal/strutil/strutil.go
        - '**/*_test.go'
    patterns:
      - pattern-either:
          - pattern: strutil.MergeUnique([]string{...}, ...)
          - pattern: MergeUnique([]string{...}, ...)

  - id: error-wrap-must-add-context
    languages: [go]
    severity: ERROR
    message: >-
      fmt.Errorf("%w", err) is an identity wrap: wrapcheck is satisfied but
      the operator sees the same message. Add a prefix that names the failed
      step (fmt.Errorf("reload pidfile: %w", err)). Identity wrap is only
      for an error that is already operator-facing; annotate that site.
    paths:
      exclude:
        - '**/*_test.go'
    patterns:
      - pattern: fmt.Errorf("%w", $ERR)

  - id: enabled-must-use-cfgval-disabled
    languages: [go]
    severity: ERROR
    message: >-
      enabled: false is cfgval.Disabled. An absent or non-boolean enabled
      means the entry stays on; inlining the type-assert drifts from that
      contract. Call cfgval.Disabled(entry).
    paths:
      exclude:
        - internal/cfgval/**
        - '**/*_test.go'
    patterns:
      - pattern-either:
          - pattern: |
              if $V, $OK := $E["enabled"].(bool); $OK && !$V {
                ...
              }
          - pattern: |
              if $V, $OK := $E[keyEnabled].(bool); $OK && !$V {
                ...
              }
          - pattern: |
              if $V, $OK := $E[EntryKeyEnabled].(bool); $OK && !$V {
                ...
              }
          - pattern: |
              if $V, $OK := $E[entryKeyEnabled].(bool); $OK && !$V {
                ...
              }
          - pattern: |
              if $V, $OK := $E[telegrambot.KeyEnabled].(bool); $OK && !$V {
                ...
              }
          - pattern: |
              if $V, $OK := $E[KeyEnabled].(bool); $OK && !$V {
                ...
              }

  - id: tls-skip-verify-must-use-netutil
    languages: [go]
    severity: ERROR
    message: >-
      Skip-verify TLS is netutil.TLSClientConfigForMode so SNI, TLS 1.2 and
      the skip-verify spelling cannot drift between dial, HTTP, LDAP, MongoDB,
      Docker and WebSocket. Certificate inspection is the named exception: it
      sets InsecureSkipVerify so VerifyConnection can report an invalid chain
      instead of aborting the handshake.
    paths:
      exclude:
        - internal/netutil/**
        - internal/checks/cert.go
        - '**/*_test.go'
    patterns:
      - pattern-either:
          - pattern: 'InsecureSkipVerify: true'
          - pattern: $CFG.InsecureSkipVerify = true

  - id: http-client-do-must-use-httpx
    languages: [go]
    severity: ERROR
    message: >-
      HTTP Do goes through httpx.Do so a transport that returns a nil
      response without an error cannot skip the caller. Wrap the client in
      httpx.Doer and call httpx.Do.
    paths:
      exclude:
        - internal/httpx/**
        - '**/*_test.go'
    patterns:
      - pattern: $CLIENT.Do($REQ)
      - metavariable-type:
          metavariable: $CLIENT
          type: "*http.Client"

  - id: http-2xx-must-use-httpx
    languages: [go]
    severity: ERROR
    message: >-
      2xx status checks are httpx.SuccessStatus. A second divisor or class
      comparison can disagree with webhook and Telegram handling. Matching
      an arbitrary status class (1xx/2xx/3xx/...) is a different job.
    paths:
      exclude:
        - internal/httpx/**
        - '**/*_test.go'
    patterns:
      - pattern-either:
          - pattern: $CODE / 100 == 2
          - pattern: $CODE / $DIV == 2

  - id: http-error-body-must-use-httpx
    languages: [go]
    severity: ERROR
    message: >-
      Non-success HTTP bodies are httpx.ErrorBody so the trim and byte limit
      stay in one place. Pass the caller's limit.
    paths:
      exclude:
        - internal/httpx/**
        - '**/*_test.go'
    patterns:
      - pattern: |
          $BODY, $_ := io.ReadAll(io.LimitReader($RESP.Body, $LIMIT))
          ...
          strings.TrimSpace(string($BODY))
